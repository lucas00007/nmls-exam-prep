{topic:1,type:'mc',text:'Under TRID, which of the following is a valid "changed circumstance" allowing a lender to issue a revised Loan Estimate?',options:['The borrower decides they want a larger loan amount than originally applied for','The lender discovers it underestimated origination charges','A natural disaster damages the subject property after the LE was issued','The MLO is replaced by another originator at the same company'],answer:2,explanation:'Valid changed circumstances include acts of God/natural disasters affecting the property, information not reasonably available at time of LE, borrower-requested changes, and rate lock expiration. A lender underestimating its own fees is NOT a valid changed circumstance.'},
{topic:1,type:'tf',text:'True or False: Under RESPA, "affiliated business arrangements" between settlement service providers are always illegal.',options:['True','False'],answer:1,explanation:'AfBAs are NOT automatically illegal under RESPA. They are legal if: the arrangement is disclosed, the consumer is not required to use the affiliated provider, and only a return on ownership interest is paid (not a referral fee).'},
{topic:1,type:'mc',text:'What is the "three-day rule" under TRID regarding the Loan Estimate, and when does the clock start?',options:['The lender has 3 days to approve or deny the application','The Loan Estimate must be delivered within 3 business days of receiving the 6 triggering application items','The borrower has 3 days to accept or reject the LE before it expires','The lender must fund within 3 business days of the signed LE'],answer:1,explanation:'Under TRID, the lender must deliver the Loan Estimate within 3 business days of receiving all 6 triggering application items (name, SSN, income, property address, estimated value, loan amount). "Business days" here means days the lender is open for business.'},
{topic:1,type:'mc',text:'Under ECOA, which of the following is a permissible reason for denying a mortgage application?',options:['The applicant recently divorced and has a new marital status','The applicant\'s gross income is insufficient to support the requested loan amount based on DTI guidelines','The applicant is 72 years old and the lender prefers younger borrowers','The applicant receives income from public assistance programs'],answer:1,explanation:'Lenders may deny loans based on legitimate creditworthiness factors such as insufficient income, high DTI, or poor credit history. Age, marital status, and receipt of public assistance cannot be the basis for denial.'},
{topic:1,type:'tf',text:'True or False: The Gramm-Leach-Bliley Act (GLBA) requires mortgage companies to provide borrowers with a privacy notice explaining how their personal financial information is collected and shared.',options:['True','False'],answer:0,explanation:'GLBA requires financial institutions (including mortgage companies) to provide customers with a clear privacy notice at the time of establishing a customer relationship and annually thereafter, explaining what information is collected, how it is shared, and how customers can opt out.'},
{topic:1,type:'tf',text:'True or False: Under HMDA, lenders must report race and ethnicity information even if the applicant refused to provide it.',options:['True','False'],answer:0,explanation:'If an applicant refuses to provide race/ethnicity data during an in-person application, the lender must note the refusal and attempt to identify the information based on visual observation or surname. The refusal itself must be reported.'},
{topic:1,type:'mc',text:'What is the purpose of the "servicing disclosure" required under RESPA at the time of loan application?',options:['To disclose the total cost of the loan servicing fee','To inform the borrower that the lender may transfer servicing rights to another company and explain the borrower\'s rights if that occurs','To explain the lender\'s escrow analysis procedures','To provide the borrower with the name of the assigned loan servicer'],answer:1,explanation:'RESPA requires a Servicing Disclosure Statement at application, informing borrowers that the lender may sell the servicing of their loan. It also discloses the percentage of loans the lender has transferred in recent years.'},
{topic:1,type:'mc',text:'Under the Fair Housing Act, which lender behavior would constitute illegal "steering"?',options:['Recommending a 30-year fixed loan to a first-time homebuyer based on their income stability','Offering FHA loans to minority applicants in certain neighborhoods while offering conventional loans to similarly qualified white applicants in other neighborhoods','Declining a loan because the property appraised below the purchase price','Requiring all borrowers to provide 2 years of tax returns'],answer:1,explanation:'Steering under the Fair Housing Act involves directing borrowers of a protected class to different (usually less favorable) loan products, terms, or neighborhoods based on protected characteristics — even if the borrower could qualify for better products.'},
{topic:1,type:'tf',text:'True or False: TILA requires that all mortgage advertising include the APR regardless of what other information is shown.',options:['True','False'],answer:1,explanation:'TILA\'s advertising rules only require APR disclosure when a "trigger term" (specific payment amount, down payment, loan term, or rate) is used in the advertisement. Generic ads without specific financial terms don\'t require APR disclosure.'},
{topic:1,type:'mc',text:'What is the primary purpose of the "flood zone determination" required in federally related mortgage transactions?',options:['To calculate the property\'s value adjustment for being near water','To determine whether the property is in a Special Flood Hazard Area requiring mandatory flood insurance under federal law','To set the property tax assessment for waterfront properties','To determine whether the lender needs additional collateral for properties near water'],answer:1,explanation:'Federal law requires lenders to determine flood zone status before making or refinancing a federally related mortgage loan. If the property is in a SFHA, flood insurance must be purchased and maintained as a condition of the loan.'},
{topic:1,type:'tf',text:'True or False: Under RESPA, a lender may charge a borrower a fee for preparing the Closing Disclosure.',options:['True','False'],answer:1,explanation:'RESPA prohibits charging a separate fee for preparing the Closing Disclosure. The preparation of settlement disclosure documents is considered a lender\'s administrative function and cannot be itemized as a separate charge to the borrower.'},
{topic:1,type:'mc',text:'The "higher-priced mortgage loan" (HPML) classification under Regulation Z triggers which additional consumer protection?',options:['Mandatory use of a HUD-approved housing counselor before closing','A required escrow account for taxes and insurance for at least 5 years, and a full appraisal with interior inspection','An automatic 10-day right of rescission instead of the standard 3 days','Mandatory reporting to the CFPB before the loan can close'],answer:1,explanation:'HPMLs must have: a mandatory escrow account for the first 5 years, and a full interior appraisal (plus a second appraisal for flipped properties). These protect borrowers in higher-risk transactions.'},
{topic:1,type:'tf',text:'True or False: A lender who fails to provide the required RESPA disclosures can be subject to both civil liability and regulatory penalties.',options:['True','False'],answer:0,explanation:'RESPA violations can result in civil liability (borrowers can sue), regulatory penalties from the CFPB or state regulators, and in cases of knowing kickback violations, criminal penalties including fines and imprisonment.'},
{topic:1,type:'mc',text:'What is a "controlled business arrangement" disclosure under RESPA designed to accomplish?',options:['Prevent lenders from charging more than market rates for settlement services','Require disclosure when a referring party has a financial interest in a settlement service provider, so the borrower can make an informed choice','Mandate that borrowers use HUD-approved settlement service providers','Eliminate all compensation arrangements between settlement service providers'],answer:1,explanation:'An AfBA/CBA disclosure must be given when a person referring a settlement service has an ownership interest in the company receiving the referral. The disclosure lets consumers understand the financial relationship and make an informed choice.'},

// ═══ TOPIC 2 — 15 NEW (Q31-45) ═══
{topic:2,type:'mc',text:'What is the purpose of a "verbal verification of employment" (VVOE) typically performed just before closing?',options:['To ask the employer to guarantee the borrower will not be laid off','To confirm the borrower is still employed and in the same position just prior to loan funding','To obtain a wage garnishment release from the employer','To verify the employer\'s business license is current'],answer:1,explanation:'A VVOE (typically within 10 business days of closing for salaried borrowers) confirms the borrower is still employed in the same capacity as documented earlier. It prevents last-minute fraud and catches job changes that could affect qualification.'},
{topic:2,type:'tf',text:'True or False: A borrower who receives alimony or child support income must always include it on a mortgage application.',options:['True','False'],answer:1,explanation:'Under ECOA, borrowers are not required to disclose alimony, child support, or separate maintenance income UNLESS they wish to have it considered for qualifying. The lender cannot require disclosure, but may consider them if voluntarily disclosed.'},
{topic:2,type:'mc',text:'In mortgage origination, what does "lock-in period" mean for a rate lock?',options:['The period during which the borrower cannot refinance the loan','The period during which the agreed interest rate is guaranteed, regardless of market rate changes','The time the underwriter has to review and approve the file','The mandatory waiting period between application and closing'],answer:1,explanation:'A rate lock-in period is the time frame (e.g., 30, 45, 60 days) during which the lender guarantees a specific interest rate. If the loan doesn\'t close before the lock expires, the borrower must float to current rates or pay for a lock extension.'},
{topic:2,type:'mc',text:'What is a correspondent lender\'s relationship to a wholesale lender in the loan origination process?',options:['A correspondent submits completed files to a wholesale lender who reviews and funds them in the correspondent\'s name','A correspondent originates, underwrites, and funds loans in its own name, then sells the closed loans to investors','A correspondent is the same as a mortgage broker — neither ever funds loans','A correspondent only originates FHA and VA loans on behalf of wholesale lenders'],answer:1,explanation:'Correspondent lenders originate, process, and fund loans in their own name using their own capital. After closing, they sell the loans to larger investors. This distinguishes them from brokers (who never fund) and direct lenders (who may retain loans).'},
{topic:2,type:'tf',text:'True or False: The Loan Estimate must itemize all third-party settlement service fees, even for services the borrower is permitted to shop for.',options:['True','False'],answer:0,explanation:'TRID requires the LE to list all anticipated settlement charges, including third-party services. Services in the "shop" category are listed separately with a list of approved providers. All fees must be disclosed, though borrower-shopped services have greater fee flexibility.'},
{topic:2,type:'mc',text:'What does "condo warrantability" mean in the context of mortgage origination?',options:['Whether the condominium building has a valid structural warranty from the developer','Whether a condominium project meets Fannie Mae/Freddie Mac eligibility requirements for conventional mortgage financing','Whether the condo unit has a homeowner\'s warranty covering appliances and systems','Whether the condo association has sued the developer for construction defects'],answer:1,explanation:'Condo warrantability refers to whether a condo project meets GSE (and FHA/VA) eligibility criteria covering owner-occupancy ratios, HOA financial stability, insurance, and litigation status. Non-warrantable condos may require portfolio or non-QM financing.'},
{topic:2,type:'tf',text:'True or False: An MLO can provide a borrower with a guaranteed interest rate quote before pulling their credit report.',options:['True','False'],answer:1,explanation:'Without a credit report, an MLO cannot know the borrower\'s credit score tier, which directly affects rate pricing. Any quote before pulling credit is an estimate only, not a guaranteed rate. Only after verifying credit, income, property, and loan details can a rate be locked.'},
{topic:2,type:'mc',text:'What is the difference between "gross income" and "effective income" in mortgage qualifying?',options:['They are the same — both refer to income before taxes','Gross income is total pre-tax income; effective income is gross income adjusted for factors like stability, continuance, and documentation requirements','Gross income is post-tax income; effective income is pre-tax income','Effective income includes only W-2 wages; gross income includes all sources'],answer:1,explanation:'Effective income is the income the lender can actually use for qualifying after applying underwriting standards. Not all income qualifies at 100% — rental income is typically used at 75%, and variable income requires a 2-year average. Effective income is what\'s used in the DTI calculation.'},
{topic:2,type:'mc',text:'What is a "mortgage application withdrawal" and how must lenders handle it under ECOA?',options:['A withdrawal occurs when the lender rejects the application; lenders must send a denial notice within 30 days','A withdrawal occurs when the borrower voluntarily withdraws; lenders must still send a written notice of the withdrawal within a reasonable time','A withdrawal automatically triggers a full refund of all fees paid','A withdrawal is only permitted if the property fails the appraisal'],answer:1,explanation:'When a borrower withdraws their application, ECOA requires the lender to send a notice of adverse action (or a withdrawal notice) within 30 days. This ensures the borrower has a record of the outcome. The lender must also retain the file for the required retention period.'},
{topic:2,type:'tf',text:'True or False: An MLO who is paid on commission has a financial incentive to close every loan, regardless of whether it is in the borrower\'s best interest.',options:['True','False'],answer:0,explanation:'Commission-based compensation creates a potential conflict of interest. This is why the LO Compensation Rule, QM/ATR standards, and ethical obligations exist — to prevent MLOs from originating unsuitable loans solely to earn a commission.'},
{topic:2,type:'mc',text:'What information is contained in "Section 4 — Loan and Property Information" on the redesigned Form 1003?',options:['The borrower\'s employment history and income details','The loan purpose, property address, occupancy type, property value, and loan amount','The borrower\'s monthly liabilities and credit accounts','The borrower\'s demographic information for HMDA reporting'],answer:1,explanation:'Section 4 of the redesigned URLA captures the loan-specific and property-specific details: loan purpose, property address, number of units, property value/purchase price, loan amount, loan type and term, and occupancy type.'},
{topic:2,type:'tf',text:'True or False: "Lender credits" on the Loan Estimate reduce the borrower\'s closing costs but result in a higher interest rate.',options:['True','False'],answer:0,explanation:'Lender credits are negative points — the borrower accepts a higher interest rate in exchange for the lender covering some or all closing costs. This reduces upfront cash needed but increases monthly payments and total interest paid. Credits appear as a negative number on the LE/CD.'},
{topic:2,type:'mc',text:'Which of the following would be considered a "material misrepresentation" on a mortgage application?',options:['Rounding a salary to the nearest thousand dollars','Omitting a second property owned by the borrower with an existing mortgage','Estimating the closing date as one week earlier than actual','Using a maiden name instead of a married name'],answer:1,explanation:'Omitting a material liability like an existing mortgage on another property is a material misrepresentation that affects the lender\'s ability to accurately assess DTI and overall credit risk. This constitutes mortgage fraud regardless of intent.'},
{topic:2,type:'mc',text:'What does "subordinate financing" mean in the context of a purchase mortgage application?',options:['A refinance where the new loan pays off all existing liens','Any additional liens on the property (second mortgage, HELOC, or DPA lien) that are junior to the first mortgage','A government-subsidized loan product for low-income borrowers','A loan structure where the interest rate is below market rate'],answer:1,explanation:'Subordinate financing refers to any junior liens on the property — second mortgages, HELOCs, or silent second liens from DPA programs. Lenders must know about all subordinate financing because it increases the CLTV ratio and must be disclosed.'},
{topic:2,type:'tf',text:'True or False: A borrower\'s credit score alone is sufficient to determine whether they qualify for a mortgage loan.',options:['True','False'],answer:1,explanation:'Credit score is one of several qualifying factors, not the sole determinant. Underwriters evaluate credit score alongside income/DTI, assets/reserves, LTV, property type, and occupancy. An excellent credit score does not guarantee approval if other factors are deficient.'},

// ═══ TOPIC 3 — 15 NEW (Q31-45) ═══
{topic:3,type:'mc',text:'What is a "Home Possible" mortgage and who offers it?',options:['A HUD program for first-time buyers in rural areas','A Freddie Mac conventional loan program with 3% minimum down payment for low-to-moderate income borrowers','A VA loan alternative for non-veterans with military connections','An FHA loan variant requiring only 1% down from the borrower'],answer:1,explanation:'Home Possible is Freddie Mac\'s conventional affordable lending program requiring as little as 3% down for low-to-moderate income borrowers. It is similar to Fannie Mae\'s HomeReady program and allows non-borrower household income and alternative credit history.'},
{topic:3,type:'tf',text:'True or False: A borrower using gift funds for a down payment on a conventional loan with less than 20% down must contribute at least 5% of their own funds.',options:['True','False'],answer:1,explanation:'For conventional loans (Fannie Mae/Freddie Mac), when the down payment is less than 20%, the entire down payment CAN come from a gift if the LTV is 80% or less for single-family primary residences. Borrower contribution requirements vary by LTV and loan type.'},
{topic:3,type:'mc',text:'What is a "VA IRRRL" (Interest Rate Reduction Refinance Loan)?',options:['A VA loan for first-time homebuyers with income restrictions','A streamlined VA refinance allowing eligible veterans to lower their rate with minimal documentation and typically no appraisal','A VA loan for investment properties at reduced interest rates','A VA loan that reduces the principal balance for veterans facing hardship'],answer:1,explanation:'The VA IRRRL (VA streamline refinance) allows veterans with existing VA loans to refinance to a lower rate with minimal documentation — typically no appraisal, no income verification, and no credit underwriting required, as long as the loan is current.'},
{topic:3,type:'mc',text:'What is the "conforming loan limit" and who sets it each year?',options:['The maximum FHA loan amount, set annually by HUD based on area median income','The maximum loan amount eligible for purchase by Fannie Mae and Freddie Mac, set annually by the FHFA','The maximum loan amount for VA loans, set by the Department of Veterans Affairs','The minimum loan amount for jumbo loans, set by individual lenders'],answer:1,explanation:'The conforming loan limit is set annually by the FHFA based on changes in average U.S. home prices. Loans above the CLL are "jumbo" loans. High-cost areas have higher conforming limits (up to 150% of the baseline).'},
{topic:3,type:'tf',text:'True or False: FHA loans allow the seller to pay up to 6% of the purchase price toward the buyer\'s closing costs.',options:['True','False'],answer:0,explanation:'FHA allows seller concessions up to 6% of the purchase price toward the buyer\'s closing costs, prepaid items, and other financing costs. This is higher than the 3% conventional limit for LTVs above 90%. Seller concessions above 6% on FHA loans are not permitted.'},
{topic:3,type:'mc',text:'What distinguishes a "non-QM" loan from a Qualified Mortgage?',options:['Non-QM loans are illegal under Dodd-Frank regulations','Non-QM loans do not meet QM requirements but are still legal and may serve creditworthy borrowers with complex financial situations','Non-QM loans are the same as subprime loans and always carry predatory terms','Non-QM loans are only available through FHA or VA programs'],answer:1,explanation:'Non-QM loans fall outside QM guidelines (may exceed DTI limits, use non-traditional income documentation, have interest-only features, etc.) but are legal. They serve borrowers who don\'t fit standard QM boxes — like self-employed borrowers or real estate investors.'},
{topic:3,type:'tf',text:'True or False: Conventional loans always require PMI if the down payment is less than 20%, with no exceptions.',options:['True','False'],answer:1,explanation:'Some conventional alternatives avoid PMI with less than 20% down: lender-paid PMI (LPMI) — where the lender pays PMI in exchange for a higher rate; piggyback loans (80-10-10); or certain special portfolio products. PMI is common but not universal under 20% down.'},
{topic:3,type:'mc',text:'What is the maximum VA-guaranteed loan amount, and is there a limit?',options:['VA loans are capped at the conforming loan limit in all areas','There is no maximum VA loan amount, though the guarantee amount is based on conforming loan limits','VA loans are limited to $650,000 regardless of location','VA loans cannot exceed $1 million even in high-cost areas'],answer:1,explanation:'Since the Blue Water Navy Vietnam Veterans Act (2020), there is no maximum VA loan amount for veterans with full entitlement. However, the VA guaranty covering the lender without a down payment is based on local conforming loan limits.'},
{topic:3,type:'mc',text:'What is a "Graduated Payment Mortgage" (GPM)?',options:['A mortgage where payments increase with inflation automatically each year','A loan where monthly payments start low and gradually increase over a set period, designed for borrowers who expect rising income','A loan where the interest rate is fixed but the amortization period extends over 50 years','A mortgage where each payment is graduated based on a different index'],answer:1,explanation:'A GPM features lower initial monthly payments that increase (graduate) by a fixed percentage each year for a set number of years, then level off. They can result in negative amortization in early years if the initial payment is below the interest accruing.'},
{topic:3,type:'tf',text:'True or False: A "bridge loan" is a short-term loan that helps a homebuyer purchase a new home before selling their existing home.',options:['True','False'],answer:0,explanation:'A bridge loan provides short-term financing (usually 6-12 months) allowing a borrower to use equity from their current home to purchase a new home before the existing home sells. Bridge loans typically carry higher rates due to their short-term, transitional nature.'},
{topic:3,type:'mc',text:'Which of the following is a feature prohibited in Qualified Mortgages under Dodd-Frank?',options:['A 30-year fixed interest rate','A prepayment penalty after year 3','Negative amortization (where the loan balance can increase)','Monthly principal and interest payments'],answer:2,explanation:'QM loans are prohibited from having: negative amortization, interest-only payments, balloon payments (with limited exceptions), loan terms over 30 years, and points/fees exceeding 3%. These restrictions protect borrowers from high-risk loan features.'},
{topic:3,type:'tf',text:'True or False: USDA loans are available for properties in all geographic areas of the United States, not just rural areas.',options:['True','False'],answer:1,explanation:'USDA loans are only available for properties in USDA-designated eligible rural and certain suburban areas. Properties in large metropolitan areas are generally ineligible. Borrowers can check property eligibility on the USDA\'s eligibility map.'},
{topic:3,type:'mc',text:'What is an "assumable mortgage" and which loan types are typically assumable?',options:['A loan that automatically transfers to the buyer without lender approval; available on all conventional loans','A loan where a qualified buyer can take over the seller\'s existing mortgage at the original rate; FHA and VA loans are generally assumable','A loan that transfers to heirs automatically upon the borrower\'s death','A mortgage assumed by the lender if the borrower defaults; applies only to portfolio loans'],answer:1,explanation:'FHA and VA loans are generally assumable with lender qualification of the new borrower. Most conventional loans have due-on-sale clauses preventing assumption. In rising rate environments, assumable loans with low rates are highly valuable.'},
{topic:3,type:'tf',text:'True or False: A "high-balance conforming loan" requires the same down payment as a standard conforming loan.',options:['True','False'],answer:0,explanation:'High-balance conforming loans (available in high-cost areas) are technically conforming loans eligible for GSE purchase and carry similar down payment requirements. They are not jumbo loans, though they may have slightly higher rates due to LLPAs.'},
{topic:3,type:'mc',text:'What does "ARM margin" refer to in an adjustable-rate mortgage?',options:['Extra interest charged if the borrower misses a payment','A fixed percentage added to the index at each adjustment to determine the new interest rate','The maximum amount the interest rate can increase over the life of the loan','The origination fee charged by the lender on an ARM product'],answer:1,explanation:'The margin is a fixed spread (e.g., 2.75%) added to the index (e.g., SOFR) at each adjustment to determine the new note rate. The margin is set at origination and never changes, regardless of index movements.'},

{topic:4,type:'mc',text:'What is a "gift letter" and what must it contain to be acceptable for mortgage underwriting?',options:['A letter from the borrower\'s employer confirming a recent raise','A signed statement from the donor confirming: the amount of the gift, the donor\'s relationship to the borrower, the property address, and that no repayment is required','A letter from the borrower\'s bank confirming funds have been received','A letter from a nonprofit confirming the borrower qualifies for a grant'],answer:1,explanation:'A gift letter must include: donor\'s name, address, and phone; donor\'s relationship to borrower; amount of the gift; property address; a clear statement that no repayment is expected or required; and the donor\'s signature. Lenders may also require bank statements showing funds movement.'},
{topic:4,type:'tf',text:'True or False: When calculating qualifying income for commission-based borrowers, lenders typically use the most recent 12 months\' commission income.',options:['True','False'],answer:1,explanation:'Commission income (when it represents more than 25% of total income) requires a 2-year history for conventional loans. Lenders average the last 2 years of commission income per W-2s and tax returns. Using only 12 months could overstate income if commissions are declining.'},
{topic:4,type:'mc',text:'What is the significance of the "credit score used for pricing" when a borrower has scores from all three bureaus?',options:['The highest score is used for both qualification and pricing','The average of all three bureau scores is used for pricing','The middle score (of three; or lower of two) is used for qualification and pricing','The lender selects whichever score results in the best terms for the lender'],answer:2,explanation:'Fannie Mae and Freddie Mac require the "representative credit score" — the middle score if three exist, or the lower of two. For co-borrowers, the lower of each borrower\'s representative score is used for qualifying and pricing.'},
{topic:4,type:'mc',text:'Which type of income would NOT require a 2-year history to be used for qualifying?',options:['Self-employment income','Commission income exceeding 25% of total income','Social Security retirement income','Seasonal or part-time employment income'],answer:2,explanation:'Social Security retirement income is considered stable and likely to continue indefinitely. It doesn\'t require a 2-year history and can generally be "grossed up" by 25% if untaxed. Self-employment, commission, and seasonal income all require 2-year documentation.'},
{topic:4,type:'tf',text:'True or False: An underwriter may approve a loan that the AUS recommended for denial if sufficient compensating factors exist.',options:['True','False'],answer:1,explanation:'If the AUS returns an unfavorable recommendation, the lender typically cannot override it with compensating factors unless the loan can be manually underwritten under applicable guidelines. Conventional loans must generally meet AUS or specific manual UW guidelines.'},
{topic:4,type:'mc',text:'What does "non-occupant co-borrower" mean and how can this strategy help a borrower qualify?',options:['A co-borrower who owns multiple investment properties','A person who signs on the loan and is responsible for repayment but does not intend to live in the property; their income can supplement the occupying borrower\'s income','A person who occupies the property but is not on the loan or title','A co-signer whose credit score is used but whose income is excluded from qualifying'],answer:1,explanation:'A non-occupant co-borrower co-signs the loan and takes on full repayment responsibility but won\'t live in the property. FHA allows them with a 3.5% down payment. Their income can be added to the occupying borrower\'s income to meet DTI requirements.'},
{topic:4,type:'tf',text:'True or False: Alimony payments received by a borrower can be counted as qualifying income if received consistently and likely to continue for at least 3 years.',options:['True','False'],answer:0,explanation:'Alimony income received can be used for qualifying if documented (divorce decree), received for a reasonable period, and expected to continue for at least 3 years from the application date. Lenders must verify receipt through bank statements.'},
{topic:4,type:'mc',text:'What is the purpose of reviewing a borrower\'s "12-month rental history" in mortgage underwriting?',options:['To verify the borrower has never been a homeowner before','To confirm the borrower has a history of consistent, on-time housing payments when they have no traditional mortgage tradeline','To calculate the rental income the property will generate after purchase','To verify the property was not previously used as a rental by the seller'],answer:1,explanation:'For borrowers without a mortgage payment history, a 12-month rental payment history can demonstrate housing payment reliability. Some programs allow rental payment history verified through canceled checks or bank statements to substitute for a traditional credit tradeline.'},
{topic:4,type:'mc',text:'What does "cash-out refinance" mean and how does it affect underwriting compared to a rate-and-term refinance?',options:['A cash-out refinance simply pays off the existing mortgage at a lower rate; underwriting is identical to a purchase','In a cash-out refinance, the borrower takes out more than their payoff amount, receiving the difference in cash; this results in stricter LTV limits and higher rates than rate-and-term refinances','A cash-out refinance allows the borrower to pay cash at closing instead of financing','A cash-out refinance is only available on investment properties'],answer:1,explanation:'A cash-out refinance pays off the existing mortgage and provides additional cash to the borrower. It typically carries stricter LTV maximums (e.g., 80% max for conventional), higher interest rates (LLPAs), and closer scrutiny of the purpose of the funds.'},
{topic:4,type:'tf',text:'True or False: A foreclosure has a longer conventional loan waiting period than a bankruptcy.',options:['True','False'],answer:0,explanation:'Conventional (Fannie Mae) waiting periods: foreclosure = 7 years; Chapter 7 bankruptcy = 4 years; Chapter 13 = 2 years from discharge. Foreclosure has the longest conventional waiting period, reflecting the direct loss suffered by the prior lender.'},
{topic:4,type:'mc',text:'What is a "Loan-Level Price Adjustment" (LLPA) and how does it affect the borrower\'s mortgage?',options:['A government surcharge added to all FHA loans','Risk-based fees charged by Fannie Mae/Freddie Mac based on credit score, LTV, occupancy type, and other risk factors — affecting the borrower\'s rate or fees','An adjustment made to the monthly payment when the escrow account has a shortage','A fee charged by the servicer when a borrower makes a partial payment'],answer:1,explanation:'LLPAs are Fannie Mae and Freddie Mac risk-based pricing adjustments. Borrowers with lower credit scores, higher LTVs, investment properties, or cash-out refinances pay higher LLPAs — either as additional fees or baked into a higher interest rate.'},
{topic:4,type:'tf',text:'True or False: For FHA loans, mortgage insurance can be removed once the borrower reaches 20% equity.',options:['True','False'],answer:1,explanation:'FHA MIP removal rules: if the original down payment was less than 10%, MIP is permanent (for the life of the loan). If the down payment was 10% or more, MIP can be removed after 11 years. This contrasts with conventional PMI, which is removed at 78% LTV.'},
{topic:4,type:'mc',text:'What does "principal curtailment" mean in mortgage servicing?',options:['A penalty paid when the borrower pays off the loan early','An additional payment applied directly to the principal balance, reducing it faster and shortening the loan term','A reduction in the interest rate negotiated after closing','A lender\'s adjustment to the principal when property values decline'],answer:1,explanation:'A principal curtailment is an extra payment applied solely to the outstanding principal balance. Making curtailments reduces the principal faster, shortens the loan term, and reduces total interest paid over the life of the loan.'},
{topic:4,type:'mc',text:'What is "co-mingling" of funds and why is it a problem in underwriting asset documentation?',options:['Combining personal and business funds in the same bank account, making it difficult to verify the source and ownership of funds','Depositing rent from multiple properties into a single account','Using both checking and savings accounts for a single mortgage transaction','Receiving payroll via direct deposit into a joint account'],answer:0,explanation:'Co-mingling occurs when personal and business funds are deposited into the same bank account. This makes it difficult for underwriters to clearly identify personal assets and source of funds. Self-employed borrowers are especially cautioned to maintain separate accounts.'},
{topic:4,type:'tf',text:'True or False: A borrower can have an unlimited number of financed properties and still qualify for a conventional mortgage.',options:['True','False'],answer:1,explanation:'Fannie Mae limits borrowers to a maximum of 10 financed properties (including the subject) when purchasing or refinancing a second home or investment property. Borrowers with more than 10 financed properties must seek portfolio or non-QM financing.'},

{topic:5,type:'mc',text:'What is "highest and best use" in real estate appraisal and why does it matter?',options:['The use that generates the highest sale price for the seller','The most profitable, legally permissible, physically possible, and financially feasible use of a property — which establishes the basis for value estimation','The use that results in the highest property tax assessment','The use designated by the local zoning authority with no exceptions'],answer:1,explanation:'"Highest and best use" is the foundation of market value. Appraisers must determine the H&BU of both the land (as if vacant) and the property (as improved). If existing improvements don\'t represent H&BU, the value may differ significantly.'},
{topic:5,type:'tf',text:'True or False: An appraiser is permitted to accept an assignment when the fee paid is contingent on the appraiser reaching a specific value conclusion.',options:['True','False'],answer:1,explanation:'USPAP strictly prohibits appraisers from accepting assignments where the fee is contingent on reaching a predetermined value, a direction in value, or the occurrence of a related event. Contingent fees compromise appraiser independence and violate professional standards.'},
{topic:5,type:'mc',text:'What is a "Fannie Mae Form 1004" (URAR)?',options:['The standard commercial real estate appraisal form','The Uniform Residential Appraisal Report used for single-family residential properties — the most common appraisal form in mortgage lending','The standard condo appraisal form','The land and site appraisal form for vacant lots'],answer:1,explanation:'The URAR (Fannie Mae Form 1004 / Freddie Mac Form 70) is the standard full-narrative interior appraisal form for 1-4 unit single-family residential properties. It includes neighborhood analysis, site and improvement descriptions, all three approaches to value, and the final reconciled value.'},
{topic:5,type:'mc',text:'What does "external obsolescence" mean in property valuation?',options:['Physical deterioration of the property\'s exterior paint and siding','Loss in property value caused by factors external to the property — such as a nearby industrial facility, highway noise, or neighborhood decline — over which the owner has no control','The obsolescence of the property\'s mechanical systems due to age','Functional obsolescence caused by an outdated floor plan'],answer:1,explanation:'External (or economic) obsolescence is depreciation caused by factors outside the property. Examples: nearby nuisances (landfill, airport), neighborhood decline, zoning changes, or economic downturns. Unlike physical deterioration, external obsolescence is almost always incurable.'},
{topic:5,type:'tf',text:'True or False: Zoning regulations are a key consideration in the appraisal process because they affect the legal uses of a property.',options:['True','False'],answer:0,explanation:'Zoning is a critical element in every appraisal. An appraiser must identify the property\'s zoning classification and determine whether the current use is conforming, nonconforming, or whether a variance exists. Zoning affects highest and best use, which directly affects value.'},
{topic:5,type:'mc',text:'What is a "comparable sale adjustment" and how does it affect the indicated value?',options:['A reduction in the appraiser\'s fee for a simple assignment','A dollar amount added or subtracted from a comparable\'s price to account for differences between the comparable and the subject property','A required revision to the appraisal when the borrower disputes the value','A tax adjustment made by the county assessor when comparable homes sell'],answer:1,explanation:'In the Sales Comparison Approach, appraisers adjust comparable sale prices for differences with the subject. If the comp is inferior to the subject, a positive adjustment is added. If the comp is superior, a negative adjustment is subtracted. Adjusted comp prices indicate the subject\'s market value.'},
{topic:5,type:'mc',text:'What is a "property condition report" (PCR) or inspection report, and how does it relate to an appraisal?',options:['A document required by the lender to verify the appraiser\'s credentials','A physical inspection of the property\'s systems and structure performed by a licensed inspector — separate from the appraisal — that may identify issues affecting value or loan eligibility','An appraiser\'s notes about neighborhood conditions','A title company\'s review of the property\'s physical boundaries'],answer:1,explanation:'A home inspection is performed by a licensed inspector — not the appraiser — to evaluate the condition of systems (HVAC, plumbing, electrical) and structure. Significant defects found may affect the appraisal value, loan eligibility, or require repairs as a condition of financing.'},
{topic:5,type:'tf',text:'True or False: An appraiser is required to physically inspect every comparable sale they use in the Sales Comparison Approach.',options:['True','False'],answer:1,explanation:'Appraisers are not required to physically inspect comparable sales — only the subject property requires a physical inspection (for a full URAR). Comparable sale information is gathered from MLS data, public records, and other verifiable sources.'},
{topic:5,type:'mc',text:'What is "bracketing" in the Sales Comparison Approach to appraisal?',options:['The process of surrounding the subject property with a physical survey boundary','Selecting comparable sales that are both superior and inferior to the subject in key characteristics, so the subject\'s value falls within the range of adjusted comparable prices','The appraiser\'s technique of limiting value conclusions to a narrow range','The lender\'s practice of setting a minimum and maximum acceptable appraised value range'],answer:1,explanation:'"Bracketing" refers to selecting comps that "bracket" the subject — some with a feature the subject lacks, some lacking a feature the subject has. This allows the appraiser to make market-supported adjustments and demonstrate the value contribution of specific features.'},
{topic:5,type:'tf',text:'True or False: The "effective age" of a property and its "actual age" are always the same.',options:['True','False'],answer:1,explanation:'Effective age reflects a property\'s condition and utility relative to comparable properties, while actual age is simply how old the building is. A well-maintained 30-year-old home may have an effective age of 15 years. Effective age drives depreciation in the Cost Approach.'},
{topic:5,type:'mc',text:'What is a "desk review" or "field review" appraisal and when might a lender order one?',options:['A preliminary appraisal done before the property is listed for sale','A secondary appraisal review ordered when a lender questions the accuracy, methodology, or value conclusion of the original appraisal','An appraisal performed exclusively using automated valuation models','An appraisal performed by the lender\'s internal staff without an independent appraiser'],answer:1,explanation:'A desk review evaluates the original appraisal\'s accuracy without additional property inspection. A field review involves inspecting the exterior of the subject and comparable properties. Both are ordered when the lender has concerns about the original appraisal\'s reliability.'},
{topic:5,type:'mc',text:'What is an "Automated Valuation Model" (AVM) and what are its limitations?',options:['A legally required appraisal tool mandated by Dodd-Frank for all federally related transactions','A computer-generated property value estimate using statistical models and public data, which lacks physical inspection and may be unreliable for unique or complex properties','A tool used exclusively by the IRS to assess property taxes nationwide','An appraisal method approved by USPAP as equivalent to a full interior appraisal'],answer:1,explanation:'AVMs use statistical models and public records to estimate value without a physical inspection. They are fast and inexpensive but limited — they cannot account for interior condition, unique features, or recent improvements. AVMs may be used for low-risk appraisal waivers but do not meet FIRREA standards for higher-threshold transactions.'},
{topic:5,type:'tf',text:'True or False: The "as-stabilized" value in a construction or renovation appraisal reflects the property\'s value after all construction is complete and the property reaches stable occupancy.',options:['True','False'],answer:0,explanation:'"As-stabilized" value is used primarily for income-producing properties undergoing construction or renovation. It estimates value upon completion AND full stabilization. For residential renovation loans, "as-completed" or "as-repaired" is the more common term.'},
{topic:5,type:'mc',text:'Under Fannie Mae guidelines, what is the maximum age of an appraisal for a standard purchase at the time of note signing?',options:['3 months','6 months','12 months','18 months'],answer:2,explanation:'Fannie Mae requires the appraisal to be no more than 12 months old at the time of note signing. For appraisals between 4 and 12 months old, an appraisal update (Form 1004D) must be completed to confirm the property\'s value and condition have not materially declined.'},
{topic:5,type:'tf',text:'True or False: Appraisers must disclose any prior services performed on the subject property within the past 3 years.',options:['True','False'],answer:0,explanation:'USPAP requires appraisers to disclose any prior services (appraisals, reviews, or consulting) performed on the subject property within 3 years prior to the assignment date. This applies regardless of whether the prior engagement involved the same client or a different one.'},

// ═══ TOPIC 6 — 15 NEW (Q31-45) ═══
{topic:6,type:'mc',text:'What is "loan flipping" and why is it considered predatory?',options:['Buying and reselling a property quickly for profit, which is always illegal','Convincing a borrower to refinance their loan repeatedly in a short period — each time paying high fees with little or no benefit — draining equity and increasing debt','The legal practice of reselling mortgage loans on the secondary market','Transferring a mortgage from one lender to another at the borrower\'s request'],answer:1,explanation:'Loan flipping is a predatory practice where lenders or MLOs repeatedly refinance a borrower\'s loan within a short period — each time charging high fees — resulting in the borrower paying more and losing equity with no meaningful financial benefit.'},
{topic:6,type:'tf',text:'True or False: Under the GLB Act, a mortgage company must provide its privacy notice to customers only once — at origination.',options:['True','False'],answer:1,explanation:'The GLBA requires an initial privacy notice at the time the customer relationship is established AND annual notices thereafter as long as the customer relationship continues. So a mortgage servicer must provide annual privacy notices every year.'},
{topic:6,type:'mc',text:'What does "elder financial abuse" mean in the context of mortgage lending?',options:['Charging elderly borrowers higher rates because of their age','Exploiting an older adult\'s assets, income, or home equity through fraudulent or deceptive practices, including unsuitable reverse mortgages, excessive fees, or deed theft','Refusing to make loans to borrowers over age 70','Marketing special "senior discount" mortgage products that don\'t actually save money'],answer:1,explanation:'Elder financial abuse in mortgage lending includes: forging signatures on deeds or refinance documents, coercing seniors into reverse mortgages that strip equity, and deed theft. MLOs have an ethical and legal obligation to identify and report suspected exploitation.'},
{topic:6,type:'mc',text:'What is a "No-Documentation" or "No-Doc" loan and why are they largely restricted under current regulations?',options:['A loan that requires no appraisal — only a tax bill is needed to document property value','A loan that allowed borrowers to obtain mortgages without verifying income or assets, which contributed to the 2008 financial crisis and is now prohibited under the ATR rule','A government program allowing veterans to get mortgages without employment documentation','A portfolio lender product available for borrowers with excellent credit'],answer:1,explanation:'No-doc loans allowed borrowers to obtain mortgages without income or asset verification. These products fueled the subprime crisis. The Dodd-Frank ATR rule now requires lenders to make a reasonable, documented determination that the borrower can repay — effectively prohibiting true no-doc loans for most products.'},
{topic:6,type:'tf',text:'True or False: A mortgage company is required by law to have written anti-money laundering policies and procedures.',options:['True','False'],answer:0,explanation:'FinCEN rules require non-bank mortgage companies to establish anti-money laundering programs, file Suspicious Activity Reports, and maintain records. Written AML policies and procedures are a mandatory component of a compliant AML program.'},
{topic:6,type:'mc',text:'Which of the following is an example of "occupancy fraud"?',options:['A borrower moving into a property they previously rented out','A borrower applying for an owner-occupied loan rate on a property they intend to rent out, falsely claiming it will be their primary residence','A landlord converting their primary residence to a rental property','A borrower purchasing a vacation home in a ski resort area'],answer:1,explanation:'Occupancy fraud occurs when a borrower misrepresents their intended use of a property — typically claiming a property will be owner-occupied (to get better rates and terms) when they actually intend to rent it out. This is one of the most common types of mortgage fraud.'},
{topic:6,type:'tf',text:'True or False: Disparate treatment in mortgage lending means treating similarly situated borrowers differently based on a protected characteristic.',options:['True','False'],answer:0,explanation:'"Disparate treatment" is the most straightforward form of illegal discrimination — intentionally treating similarly qualified applicants differently because of a protected characteristic such as race, color, religion, national origin, sex, familial status, disability, age, or marital status.'},
{topic:6,type:'mc',text:'What is "foreclosure rescue fraud" and how does it target vulnerable homeowners?',options:['A legitimate government program to help homeowners avoid foreclosure','Schemes that target homeowners facing foreclosure by promising to save their homes in exchange for upfront fees, deed transfers, or signing over the property, while providing no real help','A legal process where the lender accepts less than the full mortgage payoff to allow a distressed property to sell','A government-mandated mediation process between lenders and delinquent borrowers'],answer:1,explanation:'Foreclosure rescue fraud preys on distressed homeowners by offering false promises of saving their homes through: fee-based "loan modification services" that do nothing, "leaseback" schemes where homeowners sign over their deed expecting to rent back and repurchase (but never can), and fraudulent short sale schemes.'},
{topic:6,type:'mc',text:'What is the purpose of the Right of Rescission and what must an MLO ethically do to protect this right?',options:['Allow lenders to cancel the loan if the borrower\'s employment changes within 3 days of closing','Give borrowers the right to cancel a refinance or home equity loan on their primary residence within 3 business days — and MLOs must provide proper notices and never pressure borrowers to waive this right','Allow the borrower to cancel the purchase contract within 3 days if financing falls through','Give the lender 3 days to reverse an approval if new derogatory information surfaces'],answer:1,explanation:'The Right of Rescission (TILA) allows borrowers to cancel a refinance or home equity loan on their primary residence within 3 business days. MLOs must provide proper rescission notice forms. Pressuring borrowers to waive this right or failing to provide proper notices is a TILA violation.'},
{topic:6,type:'tf',text:'True or False: An MLO can legally accept a referral from a home inspector as long as the MLO doesn\'t directly pay the inspector.',options:['True','False'],answer:1,explanation:'RESPA Section 8 prohibits referral fees in any form — direct or indirect. If an inspector steers borrowers to an MLO in exchange for referrals back to the inspector, this is a RESPA violation regardless of whether cash changes hands. Reciprocal referrals are illegal kickbacks.'},
{topic:6,type:'mc',text:'What does "Fair Lending" compliance require from mortgage lenders on a day-to-day basis?',options:['Approving every loan application regardless of creditworthiness','Consistently applying credit standards, documenting decisions objectively, monitoring for disparate impact, training staff, and reviewing data for patterns of differential treatment','Offering the same interest rate to all borrowers regardless of credit score or LTV','Refusing to originate loans for investment properties to avoid fair lending risk'],answer:1,explanation:'Fair lending compliance is an ongoing operational commitment: consistently applying written underwriting criteria, training staff to avoid bias, monitoring application and approval data for disparate impact, documenting exception policies, and auditing lending patterns periodically.'},
{topic:6,type:'tf',text:'True or False: A suspicious activity report (SAR) must be filed within 30 days of detecting a suspicious transaction.',options:['True','False'],answer:0,explanation:'FinCEN rules require SARs to be filed within 30 calendar days of initially detecting facts that may constitute a basis for filing. If no suspect is identified, the deadline extends to 60 days. Filing a SAR is confidential — the subject must not be notified.'},
{topic:6,type:'mc',text:'What is "contract fraud" in a real estate transaction?',options:['Using an expired purchase contract to support a loan application','Submitting a falsified or altered sales contract to the lender to misrepresent the purchase price, concessions, or terms to obtain unauthorized financing','A dispute between buyer and seller over which contract terms apply','A borrower backing out of a contract after locking in a rate'],answer:1,explanation:'Contract fraud involves altering or creating a false purchase contract to deceive the lender about the true transaction price, seller concessions, or other material terms. For example, showing the lender a contract at $300,000 when the real negotiated price is $250,000, with the difference going to the buyer, is fraud.'},
{topic:6,type:'mc',text:'What does "double-selling" fraud in mortgage lending involve?',options:['Selling a property twice to two different buyers simultaneously','Selling the same mortgage note to two different investors without the knowledge of either, thereby collecting double the proceeds fraudulently','Originating two loans on the same property for the same borrower at the same time','Charging a borrower twice for the same closing cost item'],answer:1,explanation:'"Double-selling" occurs when a lender or warehouse lender fraudulently sells the same mortgage note to two different investors, collecting the proceeds twice. This harms investors and the integrity of the secondary market and is a federal crime.'},
{topic:6,type:'mc',text:'What does the term "dual agency" mean and why might it raise ethical concerns for an MLO?',options:['When the lender also acts as the property appraiser on the same transaction','When the same real estate agent represents both the buyer and the seller, creating potential conflicts of interest that the MLO should be aware of when reviewing the transaction','When the MLO is licensed in two states simultaneously','When the mortgage company and the title company are affiliated'],answer:1,explanation:'Dual agency occurs when one real estate agent represents both buyer and seller. While legal in most states with proper disclosure, it creates conflicts of interest. MLOs should be aware of dual agency situations as they may indicate pressure on the transaction price or conditions favorable to fraud.'},
