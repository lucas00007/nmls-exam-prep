{topic:4,type:'mc',text:'What does "CLTV" stand for and how does it differ from LTV?',options:['Combined Loan to Value — it includes all liens against the property, not just the first mortgage','Consumer Loan Total Value — it measures all consumer debt compared to income','Current Loan to Value — it reflects the current market value instead of original purchase price','Calculated Lien to Value — it represents the total tax lien exposure on the property'],answer:0,explanation:'CLTV (Combined Loan-to-Value) = Total of ALL loan amounts secured by the property ÷ Appraised Value. If a borrower has a first mortgage of $200K and a HELOC of $50K on a $300K home, the CLTV is 83.3%, even though the first mortgage LTV is only 66.7%.'},
{topic:4,type:'tf',text:'True or False: Lenders are required to verify all income listed on a mortgage application using IRS Form 4506-C.',options:['True','False'],answer:0,explanation:'IRS Form 4506-C (Request for Transcript of Tax Return) authorizes the lender to obtain tax transcripts directly from the IRS to verify income as reported on the application. This is a critical fraud-prevention step in the underwriting process.'},
{topic:4,type:'mc',text:'What is the minimum credit score required for an FHA loan with a 3.5% down payment?',options:['500','540','580','620'],answer:2,explanation:'FHA requires a minimum credit score of 580 for the 3.5% down payment option. Borrowers with scores of 500-579 can still get an FHA loan but must put down at least 10%. Below 500, FHA financing is generally not available.'},
{topic:4,type:'tf',text:'True or False: Part-time income can be used for mortgage qualification if the borrower has received it consistently for at least 2 years.',options:['True','False'],answer:0,explanation:'Part-time income can be used for qualifying if it has been continuous for at least 2 years and is likely to continue. The lender will average the 2-year income history from tax returns and/or W-2s/pay stubs to determine the qualifying amount.'},
{topic:4,type:'mc',text:'What is a "hard inquiry" on a credit report in the context of mortgage applications?',options:['A request for credit made by the borrower directly to the credit bureau','An inquiry that appears when a lender pulls credit as part of an application and may temporarily lower the credit score','A lender\'s request to verify employment directly with an employer','An appraisal of the property ordered by the underwriter'],answer:1,explanation:'A hard inquiry occurs when a lender pulls a borrower\'s credit as part of an application process. Multiple hard inquiries in a short period (30-45 days) for a mortgage are typically treated as a single inquiry by credit scoring models to allow rate shopping.'},
{topic:4,type:'mc',text:'In the context of reserves, what does "2 months PITI" mean?',options:['The borrower must have saved enough to make 2 extra loan payments before closing','The borrower must have liquid assets equal to 2 months of principal, interest, taxes, and insurance remaining AFTER closing','The borrower can skip 2 payments after closing without penalty','The borrower must show 2 months of bank statements'],answer:1,explanation:'Reserve requirements ensure the borrower has funds remaining AFTER closing. "2 months PITI" means the borrower must have liquid assets (cash, accessible investment accounts) equal to 2 full monthly housing payments left over after the down payment and closing costs are paid.'},
{topic:4,type:'tf',text:'True or False: Student loan payments must always be counted in a borrower\'s monthly obligations for DTI purposes, even if currently in deferment.',options:['True','False'],answer:0,explanation:'Even deferred student loans must be counted in DTI. For conventional loans, if the payment is deferred, lenders typically use either the actual payment or 1% of the outstanding balance (whichever is greater) as the monthly obligation.'},
{topic:4,type:'mc',text:'What is "mortgage insurance" and why is it required?',options:['Insurance the borrower buys to protect their belongings inside the home','Insurance that protects the lender (not the borrower) against losses if the borrower defaults on a high-LTV loan','Life insurance tied to the mortgage that pays off the balance if the borrower dies','Flood insurance required for properties in FEMA flood zones'],answer:1,explanation:'Mortgage insurance (PMI on conventional, MIP on FHA) protects the LENDER — not the borrower — from financial loss if the borrower defaults. It is required when the down payment is less than 20% (conventional) or on all FHA loans, because higher LTV loans carry more lender risk.'},
{topic:4,type:'tf',text:'True or False: Overtime and bonus income can be used for qualifying if the borrower has received it for at least 1 year and the employer confirms it will continue.',options:['True','False'],answer:1,explanation:'Overtime and bonus income generally require a 2-year history to be considered reliable for qualifying purposes (per Fannie Mae/Freddie Mac guidelines). A 1-year history is typically insufficient without a longer track record of consistent receipt.'},
{topic:4,type:'mc',text:'What does a "subject-to" condition on an appraisal mean for the underwriting process?',options:['The property value is subject to future market appreciation','The loan is approved subject to the borrower\'s continued employment','The appraisal value is contingent on specific repairs or improvements being completed before loan closing','The borrower must obtain additional insurance as a condition of the appraisal'],answer:2,explanation:'A "subject-to" appraisal means the appraiser has determined the property value based on the assumption that specific repairs or improvements will be completed. The lender typically requires proof of completion (photos, receipts, or re-inspection) before closing.'},
{topic:4,type:'mc',text:'Which of the following is NOT considered a liquid asset for reserve purposes?',options:['Savings account balance','Money market funds','Vested 401(k) balance (with 60% haircut)','Non-vested stock options'],answer:3,explanation:'Non-vested stock options cannot be used as reserves because the borrower cannot access them without employment conditions being met. Savings, money market funds, and vested retirement accounts (with a discount for penalties) are acceptable liquid reserves.'},
{topic:4,type:'tf',text:'True or False: A "manual underwrite" means a human underwriter reviews the file rather than relying solely on an automated underwriting system decision.',options:['True','False'],answer:0,explanation:'A manual underwrite means a human underwriter reviews and makes the credit decision without automated system approval. This may be required when the AUS returns a "refer" finding, for government loans in certain situations, or when compensating factors need human judgment.'},
{topic:4,type:'mc',text:'What is the primary purpose of the IRS Form 4506-C in the mortgage process?',options:['To authorize the lender to verify the borrower\'s employment','To request IRS tax transcripts to verify income reported on the application','To notify the IRS of a new mortgage on the property','To document the borrower\'s federal income tax payment history'],answer:1,explanation:'Form 4506-C allows the lender to request official tax transcripts from the IRS to verify that the income reported on the mortgage application matches what was reported to the IRS. It is a key fraud prevention and income verification tool.'},

// ═══════════════════════════════════════════
// TOPIC 5 — Appraisal & Property Valuation
// ═══════════════════════════════════════════
{topic:5,type:'mc',text:'Which of the three appraisal approaches is most commonly used for single-family residential properties?',options:['Cost Approach','Income Approach','Sales Comparison Approach','Replacement Value Approach'],answer:2,explanation:'The Sales Comparison Approach is the primary method for residential properties. It compares the subject property to recently sold comparable properties with adjustments for differences.'},
{topic:5,type:'tf',text:'True or False: An appraiser is hired by and works directly for the mortgage lender to ensure the property value supports the loan amount.',options:['True','False'],answer:1,explanation:'Appraisers must be independent. Lenders use Appraisal Management Companies (AMCs) to ensure independence and prevent pressure on valuations, as required by HVCC and Dodd-Frank.'},
{topic:5,type:'mc',text:'Under FIRREA, which properties require a state-certified appraisal?',options:['All residential properties regardless of value','Federally related transactions over $400,000 (or $500,000 for some rural residential)','Only commercial properties over $1 million','Properties in flood zones only'],answer:1,explanation:'FIRREA requires state-certified appraisals for federally related transactions over certain thresholds. Below those thresholds, evaluations or state-licensed appraisers may be used.'},
{topic:5,type:'mc',text:'What is "market value" as defined in appraisal standards?',options:['The price a seller is asking for a property','The most probable price a property would bring in a competitive market under normal conditions','The assessed value assigned by a county tax assessor','The replacement cost of improvements on the land'],answer:1,explanation:'Market value is the most probable price — not the highest or lowest — a property would sell for between a willing buyer and seller, both reasonably informed, with adequate time, and neither under duress.'},
{topic:5,type:'tf',text:'True or False: A borrower is entitled to receive a copy of the appraisal report only if they request it in writing.',options:['True','False'],answer:1,explanation:'Under ECOA, lenders must automatically provide applicants with a copy of the appraisal and all written valuations — without waiting for a request — promptly and no later than 3 business days before consummation.'},
{topic:5,type:'mc',text:'In the Cost Approach, what does "depreciation" refer to?',options:['The loss in value of the mortgage due to changing rates','A reduction in property value from physical deterioration, functional obsolescence, or external obsolescence','The amortization of the loan balance over time','Annual property tax increases'],answer:1,explanation:'Cost Approach depreciation accounts for three types of value loss: physical deterioration (wear/tear), functional obsolescence (outdated features), and external/economic obsolescence (neighborhood decline).'},
{topic:5,type:'mc',text:'Which condition would most likely cause an appraiser to flag a property?',options:['A recently painted exterior','Evidence of water intrusion or mold in the basement','A neighbor\'s well-maintained garden','Comparable sales within 0.5 miles'],answer:1,explanation:'Appraisers must report adverse physical conditions including water damage, mold, structural issues, and roof damage. Such conditions can require repair before funding or result in a reduced value.'},
{topic:5,type:'tf',text:'True or False: An appraisal and a home inspection serve the same purpose and both protect the buyer from defects.',options:['True','False'],answer:1,explanation:'An appraisal estimates market value for the lender\'s benefit. A home inspection is a detailed physical examination of the property for the buyer\'s benefit. They serve completely different purposes.'},
{topic:5,type:'mc',text:'When an appraiser uses "comparable sales," which time frame is generally preferred?',options:['Within the last 6 months','Within the last 12 months','Within the last 24 months','Within the last 36 months'],answer:0,explanation:'Preferred comps are those that closed within the last 6 months and within a 1-mile radius. Older or more distant comps may be used in limited markets, but the appraiser must explain the deviation.'},
{topic:5,type:'tf',text:'True or False: The Income Approach to value is the primary method used for owner-occupied single-family home appraisals.',options:['True','False'],answer:1,explanation:'The Income Approach (capitalizing net operating income) is primarily used for income-producing properties. Single-family residences primarily use the Sales Comparison Approach.'},
{topic:5,type:'mc',text:'What is the "Uniform Standards of Professional Appraisal Practice" (USPAP)?',options:['A state licensing exam for real estate agents','Ethical and professional standards that all appraisers must follow when completing appraisals','Fannie Mae\'s minimum property standards for all residential appraisals','A federal database of all completed appraisal reports'],answer:1,explanation:'USPAP, developed by The Appraisal Foundation, sets the ethical and performance standards for the appraisal profession in the United States. All licensed and certified appraisers must comply with USPAP requirements.'},
{topic:5,type:'tf',text:'True or False: Lenders are required to use only state-certified appraisers for all residential mortgage transactions.',options:['True','False'],answer:1,explanation:'Appraisers can be either state-licensed or state-certified. Licensed appraisers can typically handle non-complex 1-4 unit residential transactions up to the threshold amount. Certified appraisers handle all property types. The specific requirement depends on transaction size and complexity.'},
{topic:5,type:'mc',text:'What is an "Appraisal Management Company" (AMC) and what role does it play?',options:['A company that employs in-house appraisers exclusively for one lender','An independent company that manages the appraisal ordering process to maintain lender-appraiser independence','A government agency that sets appraisal values for FHA loans','A company that reviews appraisals for tax assessment purposes only'],answer:1,explanation:'An AMC acts as an independent intermediary between the lender and the appraiser, maintaining the separation required by Dodd-Frank and HVCC. The AMC selects, assigns, and manages the appraisal engagement to prevent lender pressure on appraisers.'},
{topic:5,type:'mc',text:'What does "GLA" stand for and why is it important in residential appraisals?',options:['General Lending Area: the geographic zone where a lender operates','Gross Living Area: the heated and cooled above-grade square footage used to compare properties','Gross Land Area: the total lot size including all structures','General Liability Assessment: the appraiser\'s certification of no conflicts of interest'],answer:1,explanation:'GLA (Gross Living Area) is the above-grade, finished, heated, and cooled floor area of the home. Accurate GLA is critical because price-per-square-foot adjustments are calculated based on GLA differences between the subject and comparable properties.'},
{topic:5,type:'tf',text:'True or False: The value conclusion in an appraisal report is always the average of the three appraisal approaches (Cost, Sales Comparison, and Income).',options:['True','False'],answer:1,explanation:'Appraisers do not simply average the three approaches. They weight the approaches based on their applicability to the property type and available data, then reconcile to a final value estimate through professional judgment — not a mathematical average.'},
{topic:5,type:'mc',text:'What is a "drive-by appraisal" (also called an exterior-only or Form 2055)?',options:['An appraisal where the appraiser physically drives through the neighborhood but makes no value conclusion','An abbreviated appraisal using only exterior observations and public records, without interior inspection','An appraisal done by a driving route-based mapping algorithm','A full URAR appraisal of a drive-through commercial property'],answer:1,explanation:'A drive-by or Form 2055 appraisal involves only an exterior inspection and public record data. It is less detailed than a full interior appraisal (Form 1004/URAR) and is typically used for refinances with adequate equity or as a cost-saving option in low-risk transactions.'},
{topic:5,type:'mc',text:'What does "Fannie Mae\'s Collateral Underwriter" (CU) tool do?',options:['It approves or denies loan applications based on borrower credit','It performs automated risk scoring of appraisal reports to detect overvaluation and guideline violations','It sets the maximum loan amount for conforming mortgages','It verifies the appraiser\'s state license status'],answer:1,explanation:'Collateral Underwriter (CU) is Fannie Mae\'s proprietary appraisal risk assessment tool. It analyzes appraisal reports and comparable sales using a database of millions of appraisals and property data to flag potential overvaluation, unusual adjustments, or data quality issues.'},
{topic:5,type:'tf',text:'True or False: An appraisal "reconsideration of value" (ROV) allows a borrower or lender to request the appraiser to reconsider their value conclusion if they believe relevant comps were missed.',options:['True','False'],answer:0,explanation:'An ROV allows a borrower or lender to provide additional information (comparable sales the appraiser may have overlooked, corrections to property data) and request the appraiser reconsider their value. Appraisers must respond but are not required to change their conclusion.'},
{topic:5,type:'mc',text:'What is a "subject property" in the context of an appraisal?',options:['A property that is the subject of a foreclosure action','The property being appraised in the current assignment','The most recently sold comparable property in the neighborhood','The appraiser\'s own property used as a control sample'],answer:1,explanation:'The "subject property" is simply the property being appraised in a given assignment. Appraisers describe the subject\'s characteristics, then compare it to similar sold properties (comparables) to determine its market value.'},
{topic:5,type:'tf',text:'True or False: Lenders may not use an appraisal that is more than 12 months old without an update.',options:['True','False'],answer:0,explanation:'Fannie Mae and most lenders require appraisals to be no more than 12 months old at the time of note signing. If an appraisal is between 4-12 months old, an appraisal update (Form 1004D) is often required to confirm the original value is still valid.'},
{topic:5,type:'mc',text:'What is "functional obsolescence" in property valuation?',options:['Physical wear and deterioration of a property\'s structure','A loss in value due to an outdated or inadequate feature within the property itself','Declining property values caused by external factors like a nearby landfill','Depreciation caused by age alone'],answer:1,explanation:'Functional obsolescence is a loss in value due to an outdated, inadequate, or excess feature of the property — like only 1 bathroom in a 4-bedroom home, low ceilings, outdated floor plan, or a bedroom accessible only through another bedroom.'},
{topic:5,type:'mc',text:'What is an "as-is" versus an "as-repaired" appraisal value?',options:['"As-is" reflects current condition; "as-repaired" reflects value after specified improvements are complete','Both represent the same value since market conditions apply to all properties equally','As-is means the property is livable; as-repaired means it has been condemned','As-is is for new construction; as-repaired is for resale properties'],answer:0,explanation:'"As-is" value is the current market value in the property\'s present condition. "As-repaired" (or "subject-to") value represents the estimated market value assuming specific repairs or renovations are completed. The as-repaired value is used for renovation loans like FHA 203(k).'},
{topic:5,type:'tf',text:'True or False: The Income Approach uses a "capitalization rate" (cap rate) to convert a property\'s net operating income into a value estimate.',options:['True','False'],answer:0,explanation:'In the Income Approach, Value = Net Operating Income ÷ Capitalization Rate. For example, a property with $60,000 NOI and a 6% cap rate has an indicated value of $1,000,000. The cap rate reflects the risk and return expectations of the market for that property type.'},
{topic:5,type:'mc',text:'What distinguishes a "licensed appraiser" from a "certified residential appraiser"?',options:['Licensed appraisers can only appraise mobile homes; certified appraisers handle all property types','Licensed appraisers are limited to non-complex 1-4 unit properties below a certain value threshold; certified appraisers face no such limitation','Licensed appraisers must work for a licensed broker; certified appraisers work independently','There is no meaningful distinction between the two titles'],answer:1,explanation:'State-licensed appraisers are generally limited to non-complex 1-4 unit residential properties under a value threshold (set by each state). Certified residential appraisers can handle any 1-4 unit residential property. Certified general appraisers can appraise all property types including commercial.'},
{topic:5,type:'tf',text:'True or False: An appraiser who accepts a loan from a lender in exchange for inflating a property value is committing appraisal fraud.',options:['True','False'],answer:0,explanation:'An appraiser who deliberately inflates a property value in exchange for money, future business, or other compensation is committing appraisal fraud — a federal crime. This harms lenders, investors, neighboring property values, and the integrity of the mortgage market.'},
{topic:5,type:'mc',text:'What is "neighborhood analysis" in a residential appraisal?',options:['A census of the number of households within a 1-mile radius','An examination of the neighborhood\'s characteristics, trends, and boundaries that affect the subject property\'s value','An evaluation of local school district ratings for family buyers','A comparison of crime statistics between different neighborhoods'],answer:1,explanation:'Neighborhood analysis involves examining factors that affect value: land use patterns, proximity to employment, amenities and services, property condition trends (improving, stable, declining), price range, and marketing time. It provides context for the appraiser\'s value conclusion.'},

// ═══════════════════════════════════════════
// TOPIC 6 — Ethics & Fraud Prevention
// ═══════════════════════════════════════════
{topic:6,type:'mc',text:'Which of the following is an example of mortgage fraud for profit?',options:['A borrower overstating their income to qualify for a larger loan','An appraiser inflating property values in exchange for future business from a lender','A borrower accidentally transposing digits on a bank account number','A lender offering below-market rates to attract customers'],answer:1,explanation:'Mortgage fraud for profit involves industry insiders (appraisers, MLOs, title agents) deliberately misrepresenting information to extract money. Fraud for housing involves borrowers misrepresenting facts to obtain a loan they wouldn\'t otherwise qualify for.'},
{topic:6,type:'tf',text:'True or False: Predatory lending practices are illegal under federal law, and the CFPB is the primary federal agency responsible for enforcement.',options:['True','False'],answer:0,explanation:'The CFPB was created by Dodd-Frank specifically to oversee consumer financial protection, including enforcement against predatory lending practices.'},
{topic:6,type:'mc',text:'What is "straw buyer" fraud in mortgage lending?',options:['Using a third party\'s credit profile to obtain a loan for a different person without the lender\'s knowledge','Overpaying for a property to receive cash back at closing','Submitting multiple loan applications simultaneously to different lenders','Transferring title to a property to avoid foreclosure'],answer:0,explanation:'A straw buyer applies for a mortgage on behalf of another person who cannot qualify. The straw buyer\'s credit and income are used, but they have no intention of occupying the property. This is mortgage fraud.'},
{topic:6,type:'tf',text:'True or False: An MLO has a strict fiduciary duty to always recommend the loan product with the lowest total cost to the borrower.',options:['True','False'],answer:1,explanation:'MLOs generally have a suitability obligation, not a strict fiduciary duty. However, the LO Compensation Rule prohibits steering borrowers into loans not in their interest purely for higher MLO compensation.'},
{topic:6,type:'mc',text:'Under the SAFE Act, which of the following would likely result in an MLO\'s license being denied or revoked?',options:['Having a credit score below 680','A felony conviction involving fraud, dishonesty, or breach of trust in the past 7 years','Working for more than one employer simultaneously','Being behind on student loan payments'],answer:1,explanation:'The SAFE Act mandates license denial or revocation for felony convictions involving fraud, dishonesty, breach of trust, or money laundering within 7 years. Financial crimes permanently bar licensure.'},
{topic:6,type:'mc',text:'What is "predatory lending" most commonly characterized by?',options:['Offering competitive rates to prime borrowers to gain market share','Placing borrowers in unsuitable loans, charging excessive fees, and employing deceptive practices','Requiring thorough documentation before approving loans','Declining applications from borrowers with high DTI ratios'],answer:1,explanation:'Predatory lending targets vulnerable borrowers with deceptive terms, excessive fees, high-pressure tactics, prepayment penalties, and products designed to fail. It exploits information asymmetry between lender and borrower.'},
{topic:6,type:'tf',text:'True or False: The Bank Secrecy Act (BSA) requires mortgage companies to file Suspicious Activity Reports (SARs) when they detect potential money laundering.',options:['True','False'],answer:0,explanation:'The BSA/AML program requires many financial institutions, including non-bank mortgage companies, to file SARs for suspicious transactions that may involve money laundering, fraud, or other financial crimes.'},
{topic:6,type:'mc',text:'Which practice constitutes "steering" under fair lending laws?',options:['Directing a highly qualified borrower to a conventional loan product','Recommending a higher-cost loan to a minority borrower when they qualify for a lower-cost option','Offering different rate lock periods to different borrowers','Requiring all borrowers to provide 2 years of tax returns'],answer:1,explanation:'Steering is the illegal practice of directing protected-class borrowers toward unfavorable, higher-cost loan products when they qualify for better terms, often motivated by higher MLO compensation.'},
{topic:6,type:'tf',text:'True or False: An MLO who discovers a colleague committing mortgage fraud has a legal obligation to report it.',options:['True','False'],answer:0,explanation:'MLOs have both ethical and legal obligations to report suspected fraud. Failing to report known fraud can make the MLO complicit and subject to regulatory and criminal penalties.'},
{topic:6,type:'mc',text:'What is "equity stripping" in the context of predatory lending?',options:['A borrower voluntarily refinancing to take cash out for home improvements','A predatory lender repeatedly refinancing a borrower\'s loan to collect fees, reducing their equity over time','A lender requiring a borrower to pay off junior liens before closing','An appraiser deliberately undervaluing a property'],answer:1,explanation:'Equity stripping is a predatory practice where a lender repeatedly refinances ("loan flips") a borrower\'s loan, each time charging high fees that eat away at home equity, ultimately leading to foreclosure.'},
{topic:6,type:'mc',text:'What does "identity theft" fraud in mortgage lending typically involve?',options:['A borrower using a slightly different version of their name on the application','Using another person\'s identity, credit information, or Social Security number to obtain a mortgage without their knowledge','A borrower applying for two mortgages in the same month','A lender using the borrower\'s financial data for marketing purposes'],answer:1,explanation:'Identity theft fraud in mortgage lending involves using a real person\'s identity, SSN, credit history, or financial data — without their knowledge or consent — to fraudulently obtain a mortgage loan. It is both a federal crime and a significant consumer harm.'},
{topic:6,type:'tf',text:'True or False: An MLO who receives a gift card from a real estate agent as a "thank you" for referrals has violated RESPA.',options:['True','False'],answer:0,explanation:'RESPA Section 8 prohibits any thing of value given in exchange for referrals. A gift card from a real estate agent — even a small one — if given as a "thank you" for referring business, is a RESPA violation. There is no de minimis exception for referral compensation.'},
{topic:6,type:'mc',text:'What is "chunking" fraud in real estate?',options:['Splitting a large loan into multiple smaller loans to avoid documentation requirements','A scheme where a promoter convinces investors to purchase multiple investment properties simultaneously, often with falsified applications to different lenders','Buying a property at a discount then immediately reselling at inflated value','Illegal property flipping within the same family'],answer:1,explanation:'"Chunking" involves a promoter recruiting investors to buy multiple properties simultaneously, submitting multiple loan applications to different lenders — often with inflated incomes or fabricated down payments — without each lender knowing about the others.'},
{topic:6,type:'tf',text:'True or False: The Fair Housing Act protects consumers from discriminatory advertising, including using language or images in ads that discourage certain groups from applying.',options:['True','False'],answer:0,explanation:'The Fair Housing Act prohibits discriminatory advertising that indicates a preference for or limitation on buyers based on protected class. Using language or images that signal a property is marketed only to certain demographic groups violates the FHA.'},
{topic:6,type:'mc',text:'What is "churning" in the mortgage context?',options:['Frequently moving loan files between processors to confuse underwriters','An MLO repeatedly encouraging borrowers to refinance their loans to generate new origination fees, regardless of benefit to the borrower','The process of securitizing mortgage loans in the secondary market','Rotating between different lenders to find the lowest rates for borrowers'],answer:1,explanation:'Mortgage churning involves convincing borrowers to refinance repeatedly — often within months of each prior closing — primarily to generate new origination fees for the MLO with little or no financial benefit (or actual harm) to the borrower. It is an unethical and potentially illegal practice.'},
{topic:6,type:'mc',text:'What is an "Anti-Money Laundering" (AML) program and why must mortgage companies have one?',options:['A program that prevents lenders from making loans in high-crime areas','A compliance program required by the Bank Secrecy Act to detect and report suspicious financial activity that may indicate money laundering','A program to prevent foreclosure on government-backed loans','A credit risk program designed to identify fraudulent income documentation'],answer:1,explanation:'The BSA requires mortgage companies to establish AML programs that include: written policies, designation of a compliance officer, ongoing training, and independent testing. Real estate is a known vehicle for money laundering, making AML compliance critical for MLOs.'},
{topic:6,type:'tf',text:'True or False: Disparate impact — where a lending policy disproportionately harms a protected class even without discriminatory intent — can still constitute illegal discrimination.',options:['True','False'],answer:0,explanation:'The "disparate impact" theory of discrimination holds that a facially neutral policy that disproportionately and adversely affects a protected class can still be unlawful under the Fair Housing Act and ECOA, even if there was no discriminatory intent.'},
{topic:6,type:'mc',text:'What does "redlining" mean in the mortgage lending context?',options:['Using red ink to highlight errors on a loan application','The illegal practice of refusing loans or charging higher rates in certain geographic areas based on racial or ethnic composition','The process of flagging high-risk borrowers in underwriting','A legitimate marketing practice of focusing on profitable neighborhoods'],answer:1,explanation:'Redlining (named for the red lines historically drawn around minority neighborhoods) is the illegal practice of refusing to originate loans or offering worse terms in certain geographic areas based on the racial or ethnic composition of those areas. It violates ECOA and the Fair Housing Act.'},
{topic:6,type:'tf',text:'True or False: Under the SAFE Act, providing false or misleading information on an NMLS application can result in permanent license revocation.',options:['True','False'],answer:0,explanation:'Providing false, misleading, or fraudulent information on an NMLS application is grounds for license denial, suspension, or revocation. Intentional misrepresentation may also result in criminal prosecution, as it constitutes fraud.'},
{topic:6,type:'mc',text:'What is an "inflated appraisal" scheme?',options:['Using 3 separate appraisers to obtain different values and averaging them','Coordinating with an appraiser to over-value a property, enabling the borrower to obtain a larger loan than the property warrants, often to extract fraudulent cash at closing','Hiring the cheapest available appraiser to reduce borrower costs','Appealing an appraiser\'s value conclusion to Fannie Mae\'s Collateral Underwriter system'],answer:1,explanation:'An inflated appraisal scheme involves a corrupt appraiser (sometimes in collusion with an MLO, borrower, or seller) providing a fraudulently high value. This enables the borrower to obtain more financing than the property justifies, often to extract cash, fund a flip, or commit other fraud.'},
{topic:6,type:'mc',text:'Under what circumstances may an MLO share a borrower\'s non-public personal information (NPI) with a third party without the borrower\'s consent?',options:['Never — all NPI sharing requires explicit written consent','Only for processing and servicing the loan, or as required by law (Gramm-Leach-Bliley Act exceptions)','Any time a referral partner requests it for marketing purposes','Only after the loan has been paid off'],answer:1,explanation:'The Gramm-Leach-Bliley Act (GLBA) restricts sharing NPI. MLOs may share NPI without consent for specific exceptions: to service the loan, to comply with law, or with service providers under confidentiality agreements. Sharing for marketing to unaffiliated third parties generally requires an opt-out opportunity.'},
{topic:6,type:'tf',text:'True or False: An MLO is required to maintain records of all loan applications, including denied and withdrawn applications, for a minimum period.',options:['True','False'],answer:0,explanation:'ECOA (Regulation B) requires lenders to retain records of all credit applications — including denials, withdrawals, and closed files — for at least 25 months (for consumer credit). HMDA requires reporting and retention of loan application register data. Proper recordkeeping is both a regulatory and risk management requirement.'},
{topic:6,type:'mc',text:'What is the "Three-Day Right to Cancel" and how does it relate to ethics?',options:['The right to cancel a loan after failing the appraisal','A borrower\'s federally protected right to cancel a refinance of their primary residence within 3 business days — and an MLO\'s ethical obligation to clearly explain it','A lender\'s right to cancel a loan if the borrower\'s circumstances change before closing','A buyer\'s right to back out of a purchase contract within 3 days'],answer:1,explanation:'TILA\'s Right of Rescission gives borrowers 3 business days to cancel a refinance or home equity loan on their primary residence. An ethical MLO clearly explains this right — including providing the proper cancellation notice — and never pressures borrowers to waive it.'},
{topic:6,type:'mc',text:'What does the term "yield spread premium" (YSP) refer to historically in mortgage lending?',options:['The profit a lender earns on a loan held in its portfolio','Compensation paid by a wholesale lender to a mortgage broker for delivering a loan at a higher-than-minimum interest rate','The difference in yield between a Treasury bond and a mortgage-backed security','A bonus paid to the underwriter for fast turnaround times'],answer:1,explanation:'YSP was compensation paid by wholesale lenders to brokers when borrowers were placed in above-par interest rates. While legal, it created conflicts of interest where brokers could earn more by putting borrowers in higher-rate loans. The LO Compensation Rule now restricts compensation tied to loan terms.'},

// ═══════════════════════════════════════════
// TOPIC 7 — Closing & Settlement
// ═══════════════════════════════════════════
{topic:7,type:'mc',text:'The Closing Disclosure must be provided to the borrower at least how many business days before consummation?',options:['1 business day','3 business days','5 business days','7 business days'],answer:1,explanation:'Under TRID, the Closing Disclosure must be received by the borrower at least 3 business days before consummation (closing), allowing time to compare final terms to the Loan Estimate.'},
{topic:7,type:'tf',text:'True or False: At closing, "proration" refers to dividing ongoing expenses like property taxes and HOA fees between the buyer and seller based on ownership dates.',options:['True','False'],answer:0,explanation:'Proration allocates ongoing costs (property taxes, HOA dues, prepaid interest) between buyer and seller proportionally based on the closing date. The seller pays for their days of ownership; the buyer pays for theirs.'},
{topic:7,type:'mc',text:'What is a "title search" and why is it important in the closing process?',options:['A search of the property\'s structural integrity by a licensed engineer','An examination of public records to verify ownership history and identify any liens or encumbrances','A survey of the property boundaries by a licensed surveyor','A review of neighborhood crime statistics for the lender\'s risk assessment'],answer:1,explanation:'A title search examines public records to trace ownership history and identify existing claims, liens, unpaid taxes, or encumbrances. It ensures the seller can convey clear title to the buyer.'},
{topic:7,type:'mc',text:'Owner\'s title insurance protects which party from financial loss due to title defects?',options:['The lender only','The buyer/owner only','The real estate agent','Both the lender and borrower equally'],answer:1,explanation:'Owner\'s title insurance protects the buyer from losses due to title defects, fraud, forgery, or claims arising after closing. Lender\'s title insurance protects only the lender\'s interest. They are separate policies.'},
{topic:7,type:'tf',text:'True or False: Under RESPA, the lender can require the borrower to use a specific title company chosen by the lender as a condition of the loan.',options:['True','False'],answer:1,explanation:'RESPA prohibits lenders from requiring borrowers to use a specific title company as a condition of the loan. Lenders can provide a list of approved providers, but the borrower has the right to shop.'},
{topic:7,type:'mc',text:'What does "funding" refer to in the mortgage closing process?',options:['The borrower\'s delivery of the down payment check to escrow','The lender\'s disbursement of the loan proceeds to complete the transaction','The title company\'s preparation of closing documents','The underwriter\'s final loan approval'],answer:1,explanation:'Funding occurs when the lender wires the loan proceeds to the title/escrow company, enabling them to disburse funds to all parties and complete the transaction.'},
{topic:7,type:'mc',text:'At closing, "prepaid items" most commonly include:',options:['Past-due HOA fees and code violation fines','Upfront MIP/PMI, prepaid interest, and homeowner\'s insurance deposits','Transfer taxes and recording fees for the deed','Real estate commissions paid to the buyer\'s agent'],answer:1,explanation:'Prepaids are upfront payments for items paid in advance: prepaid per-diem interest (closing date to month\'s end), homeowner\'s insurance premium, and initial escrow deposits for taxes and insurance.'},
{topic:7,type:'tf',text:'True or False: If a borrower is unable to attend closing in person, they cannot complete the transaction — all signers must be physically present.',options:['True','False'],answer:1,explanation:'Borrowers who cannot attend closing can execute a Power of Attorney allowing an authorized representative to sign. Remote Online Notarization (RON) is also increasingly accepted for digital closings.'},
{topic:7,type:'mc',text:'What is an escrow impound account, and how does it benefit the lender?',options:['An account where a borrower deposits down payment funds before applying','A lender-managed account collecting monthly tax and insurance payments to ensure these obligations are paid','An account used to hold disputed closing funds','A savings account that earns interest for the borrower'],answer:1,explanation:'An escrow impound account collects 1/12 of annual property taxes and insurance with each monthly payment. The lender manages payments of these obligations, reducing risk of tax liens or insurance lapses that would threaten the collateral.'},
{topic:7,type:'tf',text:'True or False: "Dry closing" and "wet closing" refer to whether the borrower has enough cash to close.',options:['True','False'],answer:1,explanation:'Dry closing means loan funds are NOT disbursed on the day of signing (common in some states). Wet closing means funds are disbursed the same day documents are signed. This distinction relates to timing of funding, not the borrower\'s cash position.'},
{topic:7,type:'mc',text:'What is a "HUD-1 Settlement Statement" and when is it used today?',options:['The standard closing disclosure used for all mortgage transactions since 2015','A settlement statement still required for reverse mortgages and some other transactions exempt from TRID','The standard loan estimate provided at application','A disclosure required only for FHA purchase transactions'],answer:1,explanation:'The HUD-1 was the standard settlement statement before TRID replaced it in 2015 with the Closing Disclosure. The HUD-1 is still required for reverse mortgages (HECMs) and certain other transactions exempt from TRID.'},
{topic:7,type:'tf',text:'True or False: Transfer taxes and recording fees are typically zero-tolerance items on the Closing Disclosure — they cannot increase from the amounts shown on the Loan Estimate.',options:['True','False'],answer:0,explanation:'Transfer taxes are zero-tolerance items under TRID — they cannot increase from the LE to the CD. Recording fees are also zero-tolerance. If these items increase, the lender must cure (refund) the excess to the borrower within 3 calendar years of closing.'},
{topic:7,type:'mc',text:'What is "title insurance" and why is it a one-time premium (not an annual premium like homeowner\'s insurance)?',options:['Title insurance is not a one-time premium — it is paid monthly as part of the escrow account','Title insurance covers past events that may surface after closing; since these historical risks don\'t renew annually, a single lifetime premium is charged','Title insurance is only paid if a title defect is actually found during the closing process','Title insurance covers future physical damage to the title documents'],answer:1,explanation:'Title insurance protects against claims arising from PAST events in the property\'s history (forgery, undisclosed heirs, errors in public records). Since the risk is historical and doesn\'t renew each year, a single one-time premium at closing provides coverage for as long as the insured party has an interest in the property.'},
{topic:7,type:'mc',text:'What is the purpose of a "final walkthrough" before closing?',options:['To conduct the official home inspection required by the lender','To allow the buyer to verify the property\'s condition has not changed since the offer, and that agreed-upon repairs were completed','To measure the GLA for the final appraisal confirmation','To determine the exact amount of the prorated property taxes'],answer:1,explanation:'The final walkthrough (typically 24-48 hours before closing) is the buyer\'s opportunity to verify the property\'s condition, confirm that agreed repairs were completed, and ensure no new damage occurred. It is NOT a home inspection — it is a condition check.'},
{topic:7,type:'tf',text:'True or False: A "clear to close" (CTC) from the underwriter means the loan is ready to fund with no further conditions remaining.',options:['True','False'],answer:0,explanation:'A "clear to close" is issued by the underwriter when all prior conditions have been satisfied and the loan is approved for closing and funding. At CTC, the closer can prepare final loan documents and schedule the closing. It is the final underwriting sign-off.'},
{topic:7,type:'mc',text:'What does "cash to close" represent on the Closing Disclosure?',options:['The total loan amount the borrower will receive','The total amount of cash the borrower needs to bring to the closing table (down payment + closing costs - credits and deposits)','The lender\'s profit on the transaction','Only the down payment amount'],answer:1,explanation:'Cash to close is the total funds the borrower must bring to settlement. It equals the down payment plus all closing costs, minus any credits (lender credits, seller credits) and deposits already paid (like earnest money). This is the amount on the certified check or wire transfer.'},
{topic:7,type:'mc',text:'What is a "mortgage note" and what does it represent at closing?',options:['A Post-it note attached to the mortgage deed for quick reference','The borrower\'s written promise to repay the loan, including the interest rate, payment schedule, and consequences of default','The lender\'s internal approval memo for the loan file','A summary of the property\'s title history'],answer:1,explanation:'The mortgage note (or promissory note) is the borrower\'s personal promise to repay the debt. It specifies the loan amount, interest rate, payment terms, and default provisions. The deed of trust or mortgage is the separate security instrument that pledges the property as collateral.'},
{topic:7,type:'tf',text:'True or False: The deed of trust and the mortgage note are the same document.',options:['True','False'],answer:1,explanation:'The promissory note and the deed of trust (or mortgage) are separate documents. The note is the borrower\'s personal promise to repay. The deed of trust/mortgage is the security instrument that creates the lender\'s lien against the property. Both are signed at closing.'},
{topic:7,type:'mc',text:'What is a "no-closing-cost" mortgage, and what is the true cost to the borrower?',options:['A government program that eliminates all closing costs for first-time buyers','A loan where the lender pays closing costs in exchange for a higher interest rate (lender credit), meaning the borrower pays more over the life of the loan','A conventional loan requiring no origination fees but requiring full payment of third-party costs','A loan where closing costs are forgiven if the borrower stays in the home for 5+ years'],answer:1,explanation:'In a no-closing-cost mortgage, lender credits offset closing costs in exchange for a higher interest rate. The borrower pays no upfront costs but pays more each month. This can be cost-effective for borrowers who plan to sell or refinance before the higher-rate cost exceeds the upfront savings.'},
{topic:7,type:'tf',text:'True or False: In a purchase transaction, the seller always pays the real estate commission — it is never a closing cost paid by the buyer.',options:['True','False'],answer:0,explanation:'Traditionally, sellers pay the real estate commission (typically 5-6%) which is split between buyer\'s and seller\'s agents. However, recent NAR settlement rule changes (effective 2024) require buyer\'s agent compensation to be separately negotiated, and buyers may now be responsible for their own agent\'s commission in some transactions.'},
{topic:7,type:'mc',text:'What is "recordation" and why does it matter at closing?',options:['The process of recording the borrower\'s income in the loan file','The filing of the deed and mortgage/deed of trust with the county recorder\'s office to establish the lender\'s lien as a matter of public record','The closing agent\'s recording of the meeting minutes from the closing','The process of entering the loan into the lender\'s servicing system'],answer:1,explanation:'Recordation is the filing of the deed and mortgage/deed of trust with the county recorder (or register of deeds). This creates public notice of the transfer of ownership and the lender\'s lien. Proper recordation protects both the buyer\'s ownership rights and the lender\'s security interest.'},
{topic:7,type:'mc',text:'What is a "subordination agreement" and when is it needed at closing?',options:['An agreement where the seller agrees to a lower purchase price','An agreement where a junior lienholder agrees to remain in a lower lien priority position to allow a new first mortgage to take first lien position','A document where the borrower subordinates their right to rescind the loan','An agreement between two lenders to share the risk of a single loan'],answer:1,explanation:'A subordination agreement is needed when a new first mortgage replaces an existing first mortgage, but a junior lien (like a HELOC) exists. The junior lienholder must agree in writing to remain subordinate (in second position) to the new first mortgage. Without it, the HELOC would become the senior lien.'},
{topic:7,type:'tf',text:'True or False: The "Annual Percentage Rate" (APR) shown on the Closing Disclosure should generally be higher than the note interest rate.',options:['True','False'],answer:0,explanation:'The APR includes the note rate plus certain financing costs (origination fees, points, MIP/PMI, etc.) spread over the loan term, making it higher than the note rate in most cases. A lower APR than the note rate is generally a red flag indicating a calculation error.'},
{topic:7,type:'mc',text:'What does "disbursement" refer to at the closing of a mortgage transaction?',options:['The transfer of the property title from seller to buyer','The distribution of loan proceeds and other funds to the appropriate parties (seller, payoff lenders, service providers)','The lender\'s transfer of the loan file to the servicing department','The borrower\'s first monthly payment being applied to the loan balance'],answer:1,explanation:'Disbursement is the process by which the title/escrow company distributes funds after closing: loan proceeds to the seller (less payoffs and costs), payoffs to existing lienholders, and fees to service providers. Proper disbursement completes the transfer of property and creation of the new mortgage.'},
{topic:7,type:'tf',text:'True or False: A "satisfaction of mortgage" is recorded when a borrower pays off their mortgage loan in full.',options:['True','False'],answer:0,explanation:'When a mortgage is paid in full, the lender must provide a "satisfaction of mortgage" (also called a "release of lien" or "reconveyance") that is recorded in the public records to remove the lender\'s lien from the property. RESPA requires lenders to provide this within 20-30 days of payoff.'},
{topic:7,type:'mc',text:'What is "title commitment" and how does it relate to the closing process?',options:['The buyer\'s commitment to purchase the property regardless of title issues','A preliminary title insurance report identifying current title conditions and exceptions, issued before closing to assure the lender that clear title can be insured','A lender\'s internal commitment memo approving the loan for closing','The closing agent\'s fee commitment issued to the borrower'],answer:1,explanation:'A title commitment (also called a title binder) is issued by the title company before closing. It reports the current state of title — listing existing liens, easements, and exceptions — and commits to issuing title insurance upon closing, subject to satisfaction of certain conditions (like paying off existing mortgages).'},
{topic:7,type:'mc',text:'What is the role of a "closing agent" or "settlement agent" in a mortgage transaction?',options:['To approve the final loan terms on behalf of the lender','To manage the closing process, prepare and collect closing documents, collect and disburse funds, and record the deed and mortgage — acting as a neutral third party','To represent the buyer\'s interests exclusively during the closing process','To conduct the home inspection at closing on behalf of the buyer'],answer:1,explanation:'The closing agent (title company, escrow company, or attorney depending on state practice) serves as the neutral third party who: prepares closing documents, collects all funds (down payment, loan proceeds), pays all parties (seller, existing lienholders, service providers), and records the deed and mortgage to complete the transaction.'},

{topic:0,type:'mc',text:'Which of the following actions requires an MLO license under the SAFE Act?',options:['Collecting financial information on behalf of a borrower without discussing loan terms','Explaining the difference between a fixed-rate and an adjustable-rate mortgage to a prospective borrower','Ordering a credit report as a purely administrative task','Scheduling a closing appointment for a processor'],answer:1,explanation:'Offering or negotiating loan terms — including explaining product differences that could influence a borrower\'s loan choice — constitutes MLO activity under the SAFE Act and requires licensure. Purely administrative or clerical tasks do not.'},
{topic:0,type:'tf',text:'True or False: An MLO licensed in Texas can legally originate loans for borrowers in California without a California license, as long as the property is in Texas.',options:['True','False'],answer:0,explanation:'MLO licensing is state-specific. If the property is in Texas, the MLO must be licensed in Texas. Some states also require the MLO to be licensed in the state where the borrower resides. Always verify both states\' requirements.'},
{topic:0,type:'mc',text:'What is the primary difference between a mortgage banker and a mortgage broker from a regulatory perspective?',options:['Mortgage bankers are not required to be licensed; brokers are','Mortgage bankers fund loans with their own capital and may bear credit risk; brokers submit to lenders who fund and bear the risk','Mortgage bankers only originate FHA loans; brokers originate conventional loans','Mortgage bankers are regulated by the CFPB only; brokers are regulated only by state agencies'],answer:1,explanation:'The key regulatory distinction is risk and funding: mortgage bankers use their own capital (or warehouse lines) to fund loans, temporarily bearing credit risk before selling to the secondary market. Brokers never fund loans — the wholesale lender funds and bears the risk.'},
{topic:0,type:'tf',text:'True or False: The NMLS stores MLO license information but does not track employment history or regulatory actions.',options:['True','False'],answer:1,explanation:'The NMLS maintains comprehensive records on each MLO, including employment history, license status across all states, any regulatory actions (suspensions, revocations, fines), and criminal background information.'},
{topic:0,type:'mc',text:'Under the SAFE Act, what is the waiting period before a failed MLO test taker can retake the exam for the first time?',options:['7 days','30 days','60 days','90 days'],answer:1,explanation:'The SAFE Act requires a 30-day waiting period after each of the first two test failures. After three or more failures, the waiting period extends to 180 days. This encourages thorough preparation before retesting.'},
{topic:0,type:'mc',text:'What does it mean when a mortgage loan is sold "servicing released"?',options:['The lender retains the right to collect monthly payments after selling the loan','The lender sells both the loan and the servicing rights, so the new owner will also collect payments','The borrower is released from their obligation to make payments after a refinance','The servicer releases the borrower from escrow requirements after 2 years'],answer:1,explanation:'When a loan is sold "servicing released," the originating lender transfers both the loan AND the right to service it to the buyer. The borrower will begin making payments to the new servicer. "Servicing retained" means the original lender keeps collecting payments even after selling the loan.'},
{topic:0,type:'tf',text:'True or False: A mortgage company\'s NMLS license and an individual MLO\'s NMLS license are the same registration.',options:['True','False'],answer:1,explanation:'Companies have their own separate NMLS registration, while individual MLOs maintain their own individual NMLS records. Both must be maintained separately and are linked to show employment relationships.'},
{topic:0,type:'mc',text:'What is the FHA\'s primary role in the mortgage market?',options:['FHA directly lends money to low-income borrowers at subsidized rates','FHA insures approved lenders against losses on qualifying loans, enabling lenders to offer more flexible terms','FHA sets the maximum conforming loan limits used by Fannie Mae and Freddie Mac','FHA operates the secondary market for government-backed mortgage securities'],answer:1,explanation:'FHA is a mortgage insurer, not a lender. FHA insures approved lenders against losses if borrowers default on FHA-insured loans. This insurance allows lenders to offer lower down payments, lower credit score requirements, and more flexible qualifying guidelines.'},
{topic:0,type:'tf',text:'True or False: The Equal Credit Opportunity Act (ECOA) and the Fair Housing Act are both enforced exclusively by HUD.',options:['True','False'],answer:1,explanation:'ECOA is primarily enforced by the CFPB and banking regulators. The Fair Housing Act is enforced by HUD and the DOJ. Multiple agencies share enforcement responsibilities across these laws.'},
{topic:0,type:'mc',text:'What does the "points and fees" test refer to in the context of Qualified Mortgages?',options:['A test to determine whether a loan qualifies for Fannie Mae or Freddie Mac purchase','A cap limiting total points and fees to 3% of the loan amount to qualify as a QM for loans of $100,000 or more','A calculation used to determine whether a borrower can afford the loan','A test of whether the MLO charged appropriate fees relative to services provided'],answer:1,explanation:'The QM points and fees test caps total points and fees at 3% for loans of $100,000+. If exceeded, the loan is non-QM. This prevents lenders from loading loans with excessive upfront costs while still qualifying as a "safe" loan.'},
{topic:0,type:'tf',text:'True or False: The National Flood Insurance Program (NFIP) is administered by FEMA and is relevant to mortgage lenders when properties are in designated flood zones.',options:['True','False'],answer:0,explanation:'FEMA administers the NFIP. Federal law requires lenders to ensure that federally related loans on properties in Special Flood Hazard Areas are covered by flood insurance. MLOs must be aware of flood zone status during origination.'},
{topic:0,type:'mc',text:'What is the purpose of a "net tangible benefit" test on a refinance transaction?',options:['To verify the borrower\'s net worth exceeds the new loan amount','To demonstrate that the refinance provides a measurable financial benefit to the borrower','To calculate the lender\'s net profit on the transaction','To confirm the property\'s value has increased since the original purchase'],answer:1,explanation:'Many loan programs (especially FHA and VA streamlines) require a net tangible benefit — proof that the refinance meaningfully improves the borrower\'s financial position. This protects borrowers from being refinanced unnecessarily just to generate new fees.'},
{topic:0,type:'tf',text:'True or False: Mortgage loan originators are required to provide borrowers with a written list of homeownership counseling organizations within 3 business days of application.',options:['True','False'],answer:0,explanation:'Under RESPA/Regulation X, lenders must provide a list of HUD-approved homeownership counseling organizations to applicants within 3 business days of receiving a mortgage application. This is a separate requirement from the Loan Estimate.'},
{topic:0,type:'mc',text:'What distinguishes "prime" lending from "subprime" lending?',options:['Prime loans are only available for properties valued over $500,000','Prime loans are made to highly creditworthy borrowers at market rates; subprime loans are made to borrowers with credit challenges at higher rates','Prime loans are government-insured; subprime loans are conventional','Prime loans require 20% down; subprime loans require no down payment'],answer:1,explanation:'Prime lending serves borrowers with strong credit histories and low risk — qualifying for standard market rates. Subprime lending serves borrowers with credit challenges at higher rates that reflect increased default risk.'},
{topic:0,type:'mc',text:'Which of the following best describes the role of the Federal Reserve in the mortgage market?',options:['The Federal Reserve directly regulates all state-licensed mortgage companies','The Federal Reserve sets the federal funds rate, which influences long-term mortgage rates indirectly, and regulates bank holding companies','The Federal Reserve issues FHA and VA loan guarantees on behalf of the federal government','The Federal Reserve purchases mortgage-backed securities directly from borrowers'],answer:1,explanation:'The Federal Reserve sets monetary policy (including the federal funds rate), which influences overall interest rate levels. It also supervises bank holding companies. Long-term mortgage rates are more directly tied to the 10-year Treasury yield than the fed funds rate.'},
