{topic:7,type:'mc',text:'What is an "ALTA settlement" in real estate closing?',options:['ALTA settlement refers to a dispute resolution process','American Land Title Association (ALTA) settlement refers to the full real estate closing process — collecting documents, funds, distributing proceeds, and recording — governed by ALTA standards for title companies','ALTA is a type of title insurance policy; ALTA closing refers only to commercial transactions','ALTA settlement is for new construction; ALTA closing is for resale transactions only'],answer:1,explanation:'The ALTA (American Land Title Association) sets professional standards for title companies and settlement agents. An ALTA settlement (closing) refers to the comprehensive process — document preparation, fund collection, disbursement, and recording — conducted according to ALTA best practices.'},
{topic:7,type:'tf',text:'True or False: If a borrower pays more in closing costs than shown on the Loan Estimate beyond tolerance limits, the lender must refund the excess within 3 calendar years of closing.',options:['True','False'],answer:0,explanation:'When closing costs exceed TRID tolerance limits (a "tolerance cure"), the lender must reimburse the excess to the borrower within 3 calendar years of consummation. The refund can be made at closing or post-closing.'},
{topic:7,type:'mc',text:'What is a "deed in lieu of foreclosure" and when might a lender consider it?',options:['A fraudulent scheme where a homeowner transfers the deed to avoid taxes','A voluntary transfer of the property deed to the lender by a defaulting borrower to avoid foreclosure, typically when the property value is at or below the loan balance','A lender\'s legal right to foreclose without court approval','A partial payoff agreement where the borrower deeds over a portion of the property'],answer:1,explanation:'A deed in lieu allows a defaulting borrower to voluntarily transfer the property to the lender, avoiding the time and cost of formal foreclosure. The lender may agree to forgive the remaining debt. It is typically considered when the borrower has no equity and foreclosure would be costly for both parties.'},
{topic:7,type:'mc',text:'What is a "title insurance endorsement" and when might it be required?',options:['A letter from the title company endorsing the appraiser\'s value conclusion','An addendum to the standard title insurance policy extending coverage for specific risks not covered by the base policy, such as survey coverage or zoning compliance','A secondary title insurance policy required only on jumbo loans','An endorsement from the state insurance commissioner approving the title insurance company'],answer:1,explanation:'Title insurance endorsements modify or expand the standard title policy to cover specific risks. Common endorsements include ALTA 3.1 (zoning), ALTA 8.1 (environmental), and ALTA 22 (location/survey). Lenders may require endorsements based on property-specific issues.'},
{topic:7,type:'tf',text:'True or False: The borrower\'s first mortgage payment is always due exactly one month after the closing date.',options:['True','False'],answer:1,explanation:'The first payment due date depends on when in the month the loan closes. The borrower pays prepaid interest at closing (from closing date to end of that month). The first full payment is typically due on the 1st of the second month following closing.'},
{topic:7,type:'mc',text:'What is the difference between "actual" and "imputed" closing costs when analyzing a no-cost loan?',options:['Actual costs are paid by the seller; imputed costs are paid by the lender','Actual closing costs are the out-of-pocket expenses paid; imputed costs are the economic costs borne over time through the higher interest rate accepted in exchange for lender credits','Imputed costs are government fees; actual costs are lender fees','There is no difference — the terms are interchangeable'],answer:1,explanation:'In a no-cost loan, actual out-of-pocket costs at closing are zero (or minimal). However, the borrower accepts a higher interest rate, and the imputed economic cost is the additional interest paid over the life of the loan. Analyzing break-even is essential in evaluating no-cost vs. cost loan options.'},
{topic:7,type:'mc',text:'What is "constructive notice" in the context of recording a mortgage or deed?',options:['A verbal notice given by the seller to the buyer about known property defects','Legal notice to all parties of a recorded document\'s existence — because it is publicly recorded, everyone is presumed to know of it, even without actual knowledge','A written notice from the lender to the borrower that the mortgage has been sold','A notice from the county that the property is scheduled for tax auction'],answer:1,explanation:'When a deed, mortgage, or lien is recorded in the public land records, it provides constructive notice to the world — all parties are legally presumed to be aware of it. Proper and timely recording is essential to protect both lenders\' lien priority and buyers\' ownership rights.'},
{topic:7,type:'tf',text:'True or False: A "short sale" occurs when a lender approves the sale of a property for less than the outstanding mortgage balance.',options:['True','False'],answer:0,explanation:'In a short sale, the lender agrees to accept less than the full loan payoff from the sale proceeds. The difference (deficiency) may be forgiven or the borrower may still owe it depending on state law and the lender\'s agreement. Short sales are an alternative to foreclosure for distressed borrowers with little or no equity.'},
{topic:7,type:'mc',text:'What is the "right of first refusal" in the context of a real estate closing?',options:['A buyer\'s right to renegotiate the price within 3 days of signing the contract','A contractual right giving a specific person (tenant, HOA, partner) the opportunity to purchase the property before the seller accepts an offer from a third party','A lender\'s right to purchase the loan from the borrower at any time','A homeowner\'s right to refinance before the lender can sell the loan'],answer:1,explanation:'A right of first refusal (ROFR) allows a specific party to match any third-party offer before the seller can accept another buyer\'s offer. MLOs and title companies must identify ROFRs during title search, as they can affect the ability to convey clear title.'},
{topic:7,type:'mc',text:'What does "seasoning" refer to in the context of a mortgage refinance?',options:['The age of the loan being refinanced — some programs require a minimum number of months before a refinance is permitted','The process of reviewing the history of payments made on the existing loan','The time period a property must be owned before it qualifies for a cash-out refinance at full market value','Both the minimum payment history AND the minimum property ownership period required'],answer:3,explanation:'"Seasoning" applies in two contexts: (1) Payment seasoning — minimum months of payments required before certain refinance programs are available (e.g., FHA streamline requires 210 days / 6 payments). (2) Title seasoning — minimum time a property must be owned before a cash-out refinance can be based on the current appraised value.'},
{topic:7,type:'tf',text:'True or False: An "ALTA Owner\'s Policy" of title insurance protects the lender in the event a title defect is discovered after closing.',options:['True','False'],answer:1,explanation:'The ALTA Owner\'s Policy protects the OWNER (buyer), not the lender. The lender is protected by a separate ALTA Loan Policy. Borrowers typically pay for the Owner\'s Policy, while the borrower also typically pays for the Lender\'s Policy as a closing cost.'},
{topic:7,type:'mc',text:'What is "per diem interest" and how is it calculated for closing purposes?',options:['An annual interest charge divided by the number of payments','Daily interest charged from the closing date to the end of the closing month, prepaid at closing so that the first full payment covers a complete month\'s interest','Interest charged for each day a payment is late after the grace period','A penalty for paying off a loan ahead of schedule'],answer:1,explanation:'Per diem interest = (Loan Amount × Annual Interest Rate) ÷ 365. At closing, the borrower prepays interest from the closing date through the end of that month. This ensures the loan\'s payment cycle begins cleanly on the 1st of the following month.'},
{topic:7,type:'mc',text:'What is a "survey" in a real estate transaction and why might a lender require one?',options:['A borrower questionnaire about their satisfaction with the origination process','A professional measurement and mapping of a property\'s boundaries, easements, encroachments, and improvements to verify the property\'s physical characteristics','An appraisal conducted specifically for survey-grade accuracy','A title company\'s review of the recorded deed to confirm boundary descriptions'],answer:1,explanation:'A survey is conducted by a licensed land surveyor to physically measure and map the property. Lenders may require surveys to confirm property boundaries are as described in the legal description, no encroachments exist, easements are correctly identified, and improvements are within lot lines.'},
{topic:7,type:'tf',text:'True or False: "Discharge of mortgage" and "satisfaction of mortgage" describe the same process — removing the lender\'s lien after full payoff.',options:['True','False'],answer:0,explanation:'Both terms describe the same outcome — releasing the lender\'s lien after the loan is paid in full. The specific terminology varies by state: "release of lien," "deed of reconveyance" (in deed of trust states), "satisfaction of mortgage," and "discharge" all describe the document recorded to clear the lender\'s interest.'},
{topic:7,type:'mc',text:'What is a "1031 exchange" and how can it affect a real estate closing involving an investment property?',options:['A government program allowing first-time buyers to exchange one property for another without taxes','A tax-deferral strategy allowing investors to sell an investment property and reinvest proceeds in a "like-kind" property, deferring capital gains taxes — subject to strict timing requirements','An exchange of conventional loan terms for FHA terms at closing','A legal process where two property owners swap properties to defer transfer taxes'],answer:1,explanation:'A 1031 exchange allows investment property owners to defer capital gains tax by reinvesting sale proceeds into another like-kind property. The replacement property must be identified within 45 days and closed within 180 days. MLOs must be aware that 1031 exchanges affect closing timelines and require a qualified intermediary.'},,
{topic:2,type:'tf',text:'True or False: An MLO who accepts a higher commission for placing a borrower in a loan with a higher interest rate than the borrower qualifies for has violated federal law.',options:['True','False'],answer:0,explanation:'The LO Compensation Rule under Regulation Z prohibits MLOs from steering borrowers into loans based on the compensation the MLO will receive. Steering a borrower into a higher-rate loan when they qualify for a lower-rate loan — in order to earn higher compensation — is a federal violation.'},
{topic:3,type:'mc',text:'What is private label or non-agency mortgage securitization?',options:['Fannie Mae securitization of conventional conforming loans','Securitization of mortgage loans by private financial institutions without the backing of Fannie Mae, Freddie Mac, or Ginnie Mae','FHA securitization of government-insured loans through Ginnie Mae','VA loan securitization by the Department of Veterans Affairs'],answer:1,explanation:'Private label (non-agency) securitization involves private financial institutions pooling and securitizing mortgage loans — often jumbo, subprime, or alt-A — without a government guarantee. These securities carry higher credit risk and dominated the market before the 2008 financial crisis.'},
{topic:3,type:'tf',text:'True or False: A borrower may use a gift from a non-profit organization as a down payment on an FHA loan.',options:['True','False'],answer:0,explanation:'FHA allows down payment gifts from approved sources including family members, employers, labor unions, and HUD-approved non-profit organizations. The non-profit must be HUD-approved and the funds must be properly documented with a gift letter.'},
{topic:4,type:'mc',text:'What is the housing expense ratio (front-end ratio) and what does it measure?',options:['The ratio of the home price to the borrower annual income','The borrower total monthly housing costs (PITI + HOA) divided by their gross monthly income','The ratio of the down payment to the total housing payment','The percentage of the loan amount that represents equity at closing'],answer:1,explanation:'The front-end (housing expense) ratio measures the borrower proposed monthly housing payment (PITI plus HOA dues) as a percentage of gross monthly income. For example, a $2,000 monthly housing payment on $6,000 gross income = 33.3% front-end ratio.'},
{topic:5,type:'mc',text:'What is a land lease (also called a ground lease) and how does it affect property valuation?',options:['A government program allowing borrowers to lease land while building a home they own outright','A long-term lease where a landowner leases the land to an improvement owner who owns the building but not the land — affecting value because the land equity is not owned by the homeowner','A temporary lease signed before the purchase contract is finalized','A lease agreement where the lender holds the land as collateral while the borrower owns the improvements'],answer:1,explanation:'In a land lease situation, the homeowner owns the improvements (house) but leases the land under a long-term lease (often 55-99 years). Appraisers and lenders must carefully evaluate land lease terms, remaining lease term, and leasehold value since the borrower collateral does not include the land.'},
{topic:5,type:'tf',text:'True or False: An appraiser is permitted to perform both an appraisal and a home inspection on the same property in the same transaction.',options:['True','False'],answer:1,explanation:'Appraisers and home inspectors perform different functions and must keep these roles separate. USPAP requires appraisers to avoid conflicts of interest. Performing both functions on the same property for the same client in the same transaction creates a conflict and is generally prohibited.'},
{topic:5,type:'mc',text:'What does reproduction cost versus replacement cost mean in the Cost Approach to appraisal?',options:['Reproduction cost is the current labor cost; replacement cost is the current materials cost','Reproduction cost is the cost to build an exact replica using the same materials and design; replacement cost is the cost to build a functionally equivalent structure using current materials and standards','Reproduction cost applies to commercial properties; replacement cost applies to residential','Reproduction and replacement cost are identical concepts in modern appraisal practice'],answer:1,explanation:'Reproduction cost = the cost to build an exact replica including outdated features using the same materials and techniques. Replacement cost = the cost to build a functionally equivalent structure using current materials and standards. Most residential appraisals use replacement cost because it is more practical.'},
{topic:5,type:'tf',text:'True or False: Paired sales analysis is a technique appraisers use to isolate the value contribution of a single feature by comparing otherwise identical properties that differ only in that feature.',options:['True','False'],answer:0,explanation:'Paired sales analysis compares two similar properties that differ in only one feature (e.g., one has a pool, one does not) to isolate and quantify the market value contribution of that feature. This is the most reliable method for developing market-supported adjustments in the Sales Comparison Approach.'},
{topic:6,type:'mc',text:'What is wire fraud in a real estate closing and how can buyers protect themselves?',options:['Fraud involving counterfeit wire transfers detected by the bank before closing','A scheme where fraudsters impersonate title companies or agents via email to redirect wire transfer funds to fraudulent accounts; buyers should always verify wiring instructions by calling a known number before transferring funds','Fraud involving the seller forging the buyer wire authorization','A scam involving fake mortgage approval letters sent via email'],answer:1,explanation:'Real estate wire fraud involves criminals hacking or spoofing email accounts of title companies, MLOs, or agents to intercept closing wire instructions and redirect funds to fraudulent accounts. Once wired, funds are nearly impossible to recover. Buyers must always verify wiring instructions by calling using an independently verified phone number.'},
{topic:6,type:'tf',text:'True or False: An MLO who witnesses a colleague alter a borrower income documentation is not legally obligated to report it if they did not participate in the alteration.',options:['True','False'],answer:1,explanation:'MLOs who witness fraud — even if not direct participants — can face regulatory and legal consequences for failing to report it. Industry codes of ethics, SAR requirements, and fraud liability statutes require MLOs to report known or suspected fraud. Silence may be construed as complicity.'},
{topic:6,type:'mc',text:'What does identity verification require in the mortgage origination process?',options:['Only a verbal confirmation of the borrower name and address','Lenders must collect and verify government-issued photo ID to confirm the borrower identity, as required by the USA PATRIOT Act Customer Identification Program (CIP)','A full background check including school records and employment history','Verification through a credit bureau alone is sufficient for identity confirmation'],answer:1,explanation:'The USA PATRIOT Act Customer Identification Program requires financial institutions (including mortgage companies) to collect and verify specific identifying information — typically a government-issued photo ID — before establishing a customer relationship. This is a key anti-money laundering and fraud prevention requirement.'},
{topic:6,type:'tf',text:'True or False: Under the Fair Credit Reporting Act (FCRA), a borrower has the right to dispute inaccurate information on their credit report.',options:['True','False'],answer:0,explanation:'The FCRA gives consumers the right to dispute inaccurate, incomplete, or unverifiable information on their credit reports. Credit bureaus must investigate disputes within 30 days and correct or remove inaccurate information. MLOs can help borrowers understand how to dispute errors that affect mortgage qualification.'},
{topic:6,type:'mc',text:'What does lender liability mean in the context of fair lending violations?',options:['A lender liability for property damage caused by its contractors','The legal exposure a lender faces for violations of fair lending laws, including civil monetary penalties, loan buybacks, restitution to harmed borrowers, and reputational damage','A lender financial liability if the borrower defaults on the loan','The lender responsibility to maintain the property if the borrower abandons it'],answer:1,explanation:'Fair lending violations expose lenders to significant liability: civil monetary penalties from the CFPB or DOJ, injunctive relief, requirements to provide restitution or loan modifications to harmed borrowers, and mandatory fair lending compliance programs. Systemic violations can result in consent orders with tens of millions in penalties.'},
{topic:6,type:'tf',text:'True or False: The Know Your Customer (KYC) principle requires lenders to verify customer identity and assess the risk of money laundering.',options:['True','False'],answer:0,explanation:'KYC is a foundational AML and compliance principle requiring financial institutions to verify customer identity, understand the nature of customer transactions, and assess the risk that the customer may be engaged in money laundering or other financial crimes. This applies to mortgage companies under FinCEN AML rules.'},
{topic:7,type:'mc',text:'What is a closing protection letter (CPL) in a real estate settlement?',options:['A letter from the lender guaranteeing the borrower rate through closing','A document issued by the title underwriter protecting the lender and sometimes the buyer against losses caused by the closing agent fraud, dishonesty, or failure to follow closing instructions','A letter from the seller guaranteeing the property is free of defects through the closing date','A letter from the HOA confirming no outstanding dues at closing'],answer:1,explanation:'A Closing Protection Letter (CPL) is issued by the title insurance underwriter and provides the lender (and sometimes the buyer) with protection against losses caused by the closing agent theft, fraud, or failure to follow the lender closing instructions. Many lenders require a CPL as a condition of closing.'},
{topic:7,type:'tf',text:'True or False: The settlement agent fiduciary duty at closing is only to the lender, not to the buyer or seller.',options:['True','False'],answer:1,explanation:'A settlement agent (title company, escrow company, or closing attorney) generally owes fiduciary duties to ALL parties in the transaction. They must handle funds and documents impartially, follow the closing instructions of each party, and ensure proper distribution of funds and recording of documents.'},
{topic:7,type:'mc',text:'What does impound waiver mean at closing, and when might a lender permit one?',options:['The borrower waives the right to review the Closing Disclosure before signing','The borrower is permitted to pay taxes and insurance directly rather than through the lender escrow account; typically only allowed for borrowers with LTV at or below 80% and strong credit','The lender waives the requirement for the borrower to attend closing in person','The lender waives prepayment penalties in exchange for a higher rate'],answer:1,explanation:'An impound (escrow) waiver allows a borrower to manage property tax and insurance payments directly without the lender collecting them monthly. Lenders typically permit this only when the LTV is 80% or below and the borrower has a strong payment history. Some lenders charge a waiver fee.'},
];

let selectedTopic = null;
let currentQ = 0;
let score = 0;
let answered = false;
let topicQuestions = [];

// Build topic cards
const grid = document.getElementById('topics-grid');
TOPICS.forEach(t => {
  const card = document.createElement('div');
  card.className = 'topic-card';
  card.dataset.id = t.id;
  card.innerHTML = `<span class="topic-icon">${t.icon}</span><div class="topic-info"><h3>${t.name}</h3><span>${t.short}</span></div>`;
  card.addEventListener('click', () => {
    document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    selectedTopic = t.id;
    document.getElementById('btn-start').disabled = false;
  });
  grid.appendChild(card);
});

document.getElementById('btn-start').addEventListener('click', () => {
  topicQuestions = ALL_QUESTIONS.filter(q => q.topic === selectedTopic);
  currentQ = 0; score = 0;
  showQuiz();
});

function showQuiz() {
  document.getElementById('topic-screen').style.display = 'none';
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  renderQuestion();
}

let shuffledOpts = [];
let correctShuffledIdx = -1;

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuestion() {
  answered = false;
  const q = topicQuestions[currentQ];
  const total = topicQuestions.length;
  document.getElementById('topic-badge').textContent = TOPICS[selectedTopic].name;
  document.getElementById('progress-info').textContent = `Question ${currentQ + 1} of ${total}`;
  document.getElementById('progress-fill').style.width = `${((currentQ) / total) * 100}%`;
  document.getElementById('q-type-badge').textContent = q.type === 'tf' ? '✦ True / False' : '◈ Multiple Choice';
  document.getElementById('question-text').textContent = q.text;

  const correctText = q.options[q.answer];

  if (q.type === 'tf') {
    shuffledOpts = [...q.options];
  } else {
    shuffledOpts = shuffleArray([...q.options]);
  }
  correctShuffledIdx = shuffledOpts.indexOf(correctText);

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  const labels = q.type === 'tf' ? ['T', 'F'] : ['A', 'B', 'C', 'D'];
  shuffledOpts.forEach((opt, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="option-label">${labels[i]}</span>${opt}`;
    btn.addEventListener('click', () => handleAnswer(i));
    li.appendChild(btn);
    list.appendChild(li);
  });
  document.getElementById('explanation-box').classList.remove('show');
  document.getElementById('btn-next').disabled = true;
}

function handleAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = topicQuestions[currentQ];
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correctShuffledIdx) btn.classList.add(idx === correctShuffledIdx ? 'correct' : 'reveal-correct');
    if (i === idx && idx !== correctShuffledIdx) btn.classList.add('wrong');
  });
  if (idx === correctShuffledIdx) score++;
  document.getElementById('explanation-text').textContent = q.explanation;
  document.getElementById('explanation-box').classList.add('show');
  const isLast = currentQ === topicQuestions.length - 1;
  const btn = document.getElementById('btn-next');
  btn.textContent = isLast ? 'See Results →' : 'Next →';
  btn.disabled = false;
}

document.getElementById('btn-next').addEventListener('click', () => {
  currentQ++;
  if (currentQ >= topicQuestions.length) showScore();
  else renderQuestion();
});

document.getElementById('btn-back').addEventListener('click', () => {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('topic-screen').style.display = 'block';
});

function showScore() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('score-screen').style.display = 'block';
  const total = topicQuestions.length;
  const pct = Math.round((score / total) * 100);
  document.getElementById('score-num').textContent = score;
  document.getElementById('score-denom').textContent = `/ ${total}`;
  const pass = pct >= 75;
  const gradeEl = document.getElementById('score-grade');
  gradeEl.textContent = pass ? `${pct}% — PASSING` : `${pct}% — NEEDS REVIEW`;
  gradeEl.className = `score-grade ${pass ? 'grade-pass' : 'grade-fail'}`;
  document.getElementById('score-title').textContent = pass ? 'Great Work!' : 'Keep Studying';
  document.getElementById('score-msg').textContent = pass
    ? `You scored ${score} out of ${total} on "${TOPICS[selectedTopic].name}." Strong performance — move to the next topic or try again to reinforce the material.`
    : `You scored ${score} out of ${total} on "${TOPICS[selectedTopic].name}." Review the explanations carefully and retry until you consistently hit 75%+.`;
}

document.getElementById('btn-retry').addEventListener('click', () => {
  currentQ = 0; score = 0;
  showQuiz();
});

document.getElementById('btn-all').addEventListener('click', () => {
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('topic-screen').style.display = 'block';
  document.querySelectorAll('.topic-card').forEach(c => c.classList.remove('active'));
  document.getElementById('btn-start').disabled = true;
  selectedTopic = null;
});
</script>
</body>
</html>
