<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1628;
    --navy2: #0f2040;
    --gold: #c9a84c;
    --gold2: #e8c96a;
    --cream: #f5f0e8;
    --green: #2d7a4f;
    --green-light: #d4edda;
    --red: #8b2020;
    --red-light: #fde8e8;
    --gray: #6b7280;
    --border: rgba(201,168,76,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--navy); color: var(--cream); min-height: 100vh; }

  .header {
    background: linear-gradient(135deg, var(--navy2) 0%, #1a3a5c 100%);
    border-bottom: 2px solid var(--gold);
    padding: 24px 32px; text-align: center; position: relative; overflow: hidden;
  }
  .header::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg, transparent, transparent 40px, rgba(201,168,76,0.03) 40px, rgba(201,168,76,0.03) 80px);
  }
  .header h1 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--gold2); letter-spacing: 1px; position: relative; }
  .header p { color: rgba(245,240,232,0.6); font-size: 0.85rem; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; letter-spacing: 2px; text-transform: uppercase; position: relative; }

  #topic-screen { max-width: 900px; margin: 40px auto; padding: 0 20px; }
  .topic-label { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 20px; text-align: center; }
  .topics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 32px; }
  .topic-card { background: var(--navy2); border: 1px solid var(--border); border-radius: 8px; padding: 18px 20px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 14px; }
  .topic-card:hover { border-color: var(--gold); transform: translateY(-2px); }
  .topic-card.active { border-color: var(--gold2); background: rgba(201,168,76,0.12); }
  .topic-icon { font-size: 1.6rem; flex-shrink: 0; }
  .topic-info h3 { font-size: 0.9rem; font-weight: 600; color: var(--cream); }
  .topic-info span { font-size: 0.75rem; color: var(--gray); font-family: 'IBM Plex Mono', monospace; }

  .btn-start { display: block; width: 100%; max-width: 320px; margin: 0 auto; padding: 16px 32px; background: var(--gold); color: var(--navy); font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 1rem; letter-spacing: 1px; text-transform: uppercase; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
  .btn-start:hover { background: var(--gold2); transform: translateY(-1px); }
  .btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  #quiz-screen { display: none; max-width: 780px; margin: 40px auto; padding: 0 20px; }
  .quiz-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .topic-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); background: rgba(201,168,76,0.1); border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px; }
  .progress-info { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; color: var(--gray); }
  .progress-bar-wrap { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; margin-bottom: 32px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 2px; transition: width 0.4s ease; }

  .question-card { background: var(--navy2); border: 1px solid var(--border); border-radius: 12px; padding: 32px; margin-bottom: 20px; animation: fadeUp 0.3s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .q-type-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gray); margin-bottom: 14px; }
  .question-text { font-family: 'Playfair Display', serif; font-size: 1.15rem; line-height: 1.6; color: var(--cream); margin-bottom: 24px; }

  .options-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .option-btn { width: 100%; text-align: left; padding: 14px 18px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: var(--cream); font-family: 'IBM Plex Sans', sans-serif; font-size: 0.92rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 12px; }
  .option-btn:hover:not(:disabled) { border-color: var(--gold); background: rgba(201,168,76,0.08); }
  .option-label { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.08); font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; font-weight: 600; flex-shrink: 0; }
  .option-btn.correct { border-color: var(--green); background: var(--green-light); color: #1a5c35; }
  .option-btn.correct .option-label { background: var(--green); color: white; }
  .option-btn.wrong { border-color: var(--red); background: var(--red-light); color: #7a1a1a; }
  .option-btn.wrong .option-label { background: var(--red); color: white; }
  .option-btn.reveal-correct { border-color: var(--green); background: rgba(45,122,79,0.15); color: var(--cream); }
  .option-btn:disabled { cursor: default; }

  .explanation-box { margin-top: 20px; padding: 18px 20px; border-radius: 8px; border-left: 3px solid var(--gold); background: rgba(201,168,76,0.06); animation: fadeUp 0.3s ease; display: none; }
  .explanation-box.show { display: block; }
  .explanation-box strong { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 8px; }
  .explanation-box p { font-size: 0.88rem; line-height: 1.6; color: rgba(245,240,232,0.8); }

  .quiz-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .btn-nav { padding: 12px 28px; border-radius: 6px; font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: all 0.2s; border: none; }
  .btn-next { background: var(--gold); color: var(--navy); }
  .btn-next:hover { background: var(--gold2); }
  .btn-next:disabled { opacity: 0.3; cursor: not-allowed; }
  .btn-back-topics { background: transparent; border: 1px solid var(--border); color: var(--gray); }
  .btn-back-topics:hover { border-color: var(--gold); color: var(--gold); }

  #score-screen { display: none; max-width: 600px; margin: 60px auto; padding: 0 20px; text-align: center; }
  .score-circle { width: 160px; height: 160px; border-radius: 50%; border: 4px solid var(--gold); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 32px; background: rgba(201,168,76,0.08); }
  .score-num { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--gold2); line-height: 1; }
  .score-denom { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--gray); }
  .score-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--cream); margin-bottom: 12px; }
  .score-msg { color: var(--gray); font-size: 0.9rem; line-height: 1.6; margin-bottom: 32px; }
  .score-grade { font-family: 'IBM Plex Mono', monospace; font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase; padding: 8px 20px; border-radius: 20px; display: inline-block; margin-bottom: 32px; }
  .grade-pass { background: rgba(45,122,79,0.2); color: #4caf82; border: 1px solid #2d7a4f; }
  .grade-fail { background: rgba(139,32,32,0.2); color: #e07070; border: 1px solid #8b2020; }
  .score-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-retry { background: var(--gold); color: var(--navy); padding: 12px 28px; border: none; border-radius: 6px; font-weight: 700; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; }
  .btn-all { background: transparent; border: 1px solid var(--border); color: var(--cream); padding: 12px 28px; border-radius: 6px; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; }
</style>

  <h1>MLO Exam Prep</h1>

<script>
const TOPICS = [
  { id: 0, icon: '🏛️', name: 'Introduction to Mortgage Lending', short: '45 questions' },
  { id: 1, icon: '⚖️', name: 'Federal Mortgage Laws', short: 'RESPA · TILA · ECOA · HMDA' },
  { id: 2, icon: '📋', name: 'Loan Origination & Application', short: '45 questions' },
  { id: 3, icon: '🏠', name: 'Mortgage Products & Loan Types', short: '45 questions' },
  { id: 4, icon: '📊', name: 'Underwriting & Qualifying', short: '45 questions' },
  { id: 5, icon: '🔍', name: 'Appraisal & Property Valuation', short: '45 questions' },
  { id: 6, icon: '🛡️', name: 'Ethics & Fraud Prevention', short: '45 questions' },
  { id: 7, icon: '📝', name: 'Closing & Settlement', short: '45 questions' },
];

const ALL_QUESTIONS = [
{topic:0,type:'tf',text:'True or False: The SAFE Act requires all mortgage loan originators to register with the Nationwide Multistate Licensing System (NMLS).',options:['True','False'],answer:0,explanation:'The SAFE Mortgage Licensing Act of 2008 mandates that all MLOs be registered or licensed through the NMLS, ensuring a uniform standard of licensing and consumer protection across the nation.'},
{topic:0,type:'mc',text:'Which of the following best describes the primary role of a Mortgage Loan Originator (MLO)?',options:['Appraising property values for lending purposes','Taking mortgage loan applications and offering or negotiating loan terms','Underwriting and approving mortgage loans','Servicing existing mortgage loans on behalf of lenders'],answer:1,explanation:'An MLO is specifically defined as someone who takes a residential mortgage loan application AND offers or negotiates terms of a loan for compensation. Appraisal, underwriting, and servicing are separate functions.'},
{topic:0,type:'mc',text:'What is the minimum number of pre-licensing education hours required by the SAFE Act for state-licensed MLOs?',options:['10 hours','20 hours','30 hours','40 hours'],answer:1,explanation:'The SAFE Act requires a minimum of 20 hours of pre-licensing education, including 3 hours of federal law, 3 hours of ethics, 2 hours of non-traditional mortgage lending, and 12 hours of elective coursework.'},
{topic:0,type:'tf',text:'True or False: A depository bank employee who originates mortgages is required to obtain a state MLO license.',options:['True','False'],answer:1,explanation:'Bank employees (federally regulated depository institutions) must register with the NMLS but are NOT required to obtain a state license. Only non-bank, state-licensed entities require the full state licensing process.'},
{topic:0,type:'mc',text:'The mortgage industry is primarily regulated at which level?',options:['Local/municipal level only','State level only','Federal level only','Both federal and state levels'],answer:3,explanation:'Mortgage lending is regulated at BOTH federal and state levels. Federal laws set nationwide standards, while states layer additional requirements on top.'},
{topic:0,type:'mc',text:'What does "secondary market" mean in mortgage lending?',options:['The market where borrowers shop for second mortgages','The market where lenders sell previously originated loans to investors','A market for commercial real estate transactions','The government-run system for subsidized housing loans'],answer:1,explanation:'The secondary market is where already-originated mortgage loans are bought and sold between lenders, investors, and GSEs like Fannie Mae and Freddie Mac. This frees up capital for lenders to issue new loans.'},
{topic:0,type:'tf',text:'True or False: Fannie Mae and Freddie Mac are government agencies that directly lend money to homebuyers.',options:['True','False'],answer:1,explanation:'Fannie Mae and Freddie Mac are Government-Sponsored Enterprises (GSEs), not direct lenders. They purchase loans from lenders in the secondary market to provide liquidity but do not originate loans to consumers.'},
{topic:0,type:'mc',text:'Which of the following is NOT a requirement to maintain an active NMLS license?',options:['Annual continuing education (8 hours minimum)','Passing a background check','Maintaining a minimum loan volume of 12 loans per year','Renewing the license by December 31 each year'],answer:2,explanation:'There is no minimum loan volume requirement to maintain an MLO license. Requirements include continuing education, background checks, and annual renewal.'},
{topic:0,type:'mc',text:'What is the purpose of the Unique Identifier assigned through NMLS?',options:["To track the MLO's income for tax purposes","To allow consumers to look up an MLO's license history and disciplinary actions","To assign the MLO to a specific geographic territory","To restrict the MLO to a single employer"],answer:1,explanation:'The NMLS Unique Identifier (NMLS ID) allows borrowers to verify an MLO\'s license status, employment history, and any regulatory actions on the NMLS Consumer Access portal.'},
{topic:0,type:'tf',text:'True or False: The SAFE Act allows a state-licensed MLO to temporarily originate loans in another state while waiting for their new state license to be approved.',options:['True','False'],answer:0,explanation:'The SAFE Act includes a temporary authority provision allowing an MLO who applies for a license in a new state to engage in loan origination activities while their application is pending.'},
{topic:0,type:'mc',text:'Which government-sponsored enterprise (GSE) primarily focuses on purchasing loans made to low-to-moderate income borrowers in rural areas?',options:['Fannie Mae','Freddie Mac','Ginnie Mae','None — that is USDA\'s role directly'],answer:3,explanation:'USDA Rural Development (not a GSE) directly guarantees rural loans. Ginnie Mae pools FHA/VA/USDA loans into mortgage-backed securities. Fannie and Freddie focus on conventional conforming loans across all income levels.'},
{topic:0,type:'tf',text:'True or False: An individual can be both a real estate agent and a licensed MLO simultaneously in most states.',options:['True','False'],answer:0,explanation:'Many states permit dual licensing as both a real estate agent and an MLO. However, some states restrict this or require disclosure. The individual must ensure compliance with both sets of regulations and any applicable conflict-of-interest rules.'},
{topic:0,type:'mc',text:'What type of institution is a "mortgage broker"?',options:['A lender that funds loans from its own capital','An intermediary that connects borrowers with wholesale lenders but does not fund the loan','A government entity that insures residential mortgages','A servicer that collects monthly mortgage payments'],answer:1,explanation:'A mortgage broker acts as an intermediary between the borrower and wholesale lenders. Brokers originate and process loans but use the lender\'s funds to close. They are paid a fee or yield spread premium by the lender or borrower.'},
{topic:0,type:'mc',text:'The process of combining multiple mortgage loans into a pool and selling interests in that pool to investors is called:',options:['Securitization','Amortization','Hypothecation','Subordination'],answer:0,explanation:'Securitization is the process of pooling mortgage loans and issuing mortgage-backed securities (MBS) to investors. This is the foundation of the secondary market and allows capital to flow back to lenders for new originations.'},
{topic:0,type:'tf',text:'True or False: Continuing education for MLOs must be completed with the same course provider each year.',options:['True','False'],answer:1,explanation:'MLOs may choose any NMLS-approved CE provider each year. The requirement is 8 hours annually: 3 hours of federal law, 2 hours of ethics, 2 hours of non-traditional mortgage products, and 1 hour of elective content.'},
{topic:0,type:'mc',text:'Which entity is the primary federal regulator of non-bank mortgage companies?',options:['Federal Reserve','Office of the Comptroller of the Currency (OCC)','Consumer Financial Protection Bureau (CFPB)','Federal Deposit Insurance Corporation (FDIC)'],answer:2,explanation:'The CFPB, created by the Dodd-Frank Act in 2010, is the primary federal regulator for non-bank financial entities including mortgage companies, supervising compliance with federal consumer financial protection laws.'},
{topic:0,type:'mc',text:'What is the difference between "mortgage banking" and "mortgage brokering"?',options:['Mortgage bankers only service loans; brokers only originate them','Mortgage bankers fund and often sell loans from their own capital; brokers originate loans using wholesale lenders\' funds','Mortgage bankers work only with government loans; brokers handle conventional loans','There is no meaningful difference between the two'],answer:1,explanation:'Mortgage bankers (also called direct lenders or correspondent lenders) use their own capital to fund loans and may sell them in the secondary market. Brokers never fund loans — they submit completed files to wholesale lenders who fund the transaction.'},
{topic:0,type:'tf',text:'True or False: Ginnie Mae (GNMA) guarantees mortgage-backed securities backed by FHA and VA loans.',options:['True','False'],answer:0,explanation:'Ginnie Mae guarantees the timely payment of principal and interest on MBS backed by government loans — FHA, VA, USDA, and HUD\'s Office of Public and Indian Housing loans. Ginnie Mae is a government agency (unlike Fannie/Freddie which are GSEs).'},
{topic:0,type:'mc',text:'Under the SAFE Act, the minimum passing score on the NMLS national MLO test is:',options:['70%','75%','80%','85%'],answer:1,explanation:'The SAFE Act requires a minimum passing score of 75% on the NMLS National Test Component with Uniform State Content. Test takers must wait 30 days to retake after each of the first two failures, and 180 days after three or more failures.'},
{topic:0,type:'mc',text:'What does "loan servicing" refer to in the mortgage industry?',options:['The process of originating and funding a new loan','Collecting monthly payments, managing escrow accounts, and handling delinquencies on existing loans','Appraising property values for new loan requests','Marketing and advertising mortgage products to consumers'],answer:1,explanation:'Loan servicing covers all post-closing activities: collecting monthly P&I and escrow payments, managing tax and insurance disbursements, handling customer inquiries, processing payoffs, and managing delinquency and default.'},
{topic:0,type:'tf',text:'True or False: The NMLS requires MLOs to disclose any criminal history, including misdemeanors, when applying for a license.',options:['True','False'],answer:0,explanation:'NMLS applications require full disclosure of criminal history. While not all misdemeanors are disqualifying, applicants must disclose them. Financial crimes, fraud, and felonies involving dishonesty within the past 7 years are typically disqualifying.'},
{topic:0,type:'mc',text:'Which of the following best describes a "warehouse line of credit" used by mortgage bankers?',options:['A personal line of credit for MLO operating expenses','A short-term credit facility lenders use to fund mortgage loans before selling them to the secondary market','A government-backed credit facility for low-income homebuyers','A revolving credit account for property renovations'],answer:1,explanation:'A warehouse line of credit is a short-term revolving facility that mortgage bankers use to fund loans at closing. When the loan is sold to an investor in the secondary market, the proceeds repay the warehouse line, freeing it up for the next loan.'},
{topic:0,type:'tf',text:'True or False: The Community Reinvestment Act (CRA) requires lenders to meet the credit needs of all segments of their communities, including low- and moderate-income areas.',options:['True','False'],answer:0,explanation:'The CRA of 1977 requires federally regulated financial institutions to help meet the credit needs of the communities in which they do business, including low- and moderate-income neighborhoods, consistent with safe and sound banking practices.'},
{topic:0,type:'mc',text:'A "correspondent lender" differs from a mortgage broker in that a correspondent lender:',options:['Cannot originate FHA or VA loans','Funds loans in its own name and then sells them to investors','Is regulated only at the state level','Does not have to be licensed through NMLS'],answer:1,explanation:'Correspondent lenders originate and fund loans in their own name, then sell them to larger investors (aggregators or GSEs). Unlike brokers, they take on temporary credit risk. They are essentially small mortgage bankers who sell their loans rather than hold them.'},
{topic:0,type:'mc',text:'Which of the following is a key consumer protection function of the NMLS Consumer Access website?',options:['It allows consumers to lock in mortgage interest rates','It provides consumers with the ability to file tax returns online','It lets consumers verify whether an MLO is licensed and review their disciplinary history','It allows consumers to apply for mortgage pre-approvals directly'],answer:2,explanation:'NMLS Consumer Access (nmlsconsumeraccess.org) is a free, public database allowing consumers to verify the licensing status and employment history of MLOs and mortgage companies, and to see any regulatory actions taken against them.'},
{topic:0,type:'tf',text:'True or False: A mortgage loan officer assistant who only performs administrative tasks and does not discuss loan terms is required to hold an MLO license.',options:['True','False'],answer:1,explanation:'The SAFE Act exempts individuals who perform purely clerical and administrative tasks — such as ordering credit reports, scheduling appraisals, and assembling documents — from the MLO licensing requirement, as long as they do not discuss loan terms or take applications.'},
{topic:0,type:'mc',text:'The Dodd-Frank Wall Street Reform and Consumer Protection Act was passed primarily in response to:',options:['The savings and loan crisis of the 1980s','The 2007-2008 financial crisis and mortgage market collapse','Federal budget deficits in the early 2000s','Rising commercial real estate defaults in 2005'],answer:1,explanation:'Dodd-Frank was enacted in 2010 in direct response to the 2007-2008 financial crisis, which was largely caused by subprime mortgage lending, securitization failures, and lack of consumer protection oversight. It created the CFPB and established the Qualified Mortgage rule.'},
{topic:0,type:'tf',text:'True or False: An MLO who works for a bank subsidiary (not the bank itself) must obtain a state license rather than simply registering with NMLS.',options:['True','False'],answer:0,explanation:'Employees of non-depository subsidiaries of federally chartered banks are NOT covered by the federal registration exemption. They must obtain a state MLO license, even if their parent company is a federally regulated bank.'},
{topic:0,type:'mc',text:'Which of the following statements about the Qualified Mortgage (QM) rule is correct?',options:['QM loans can have balloon payments on any loan term','QM loans limit total points and fees to 3% of the loan amount for loans of $100,000 or more','QM loans require a minimum 20% down payment from the borrower','QM loans must always have a fixed interest rate'],answer:1,explanation:'The QM rule (Regulation Z) caps points and fees at 3% for loans of $100,000+. QM loans must also verify the borrower\'s ability to repay, prohibit certain risky features (like negative amortization), and have a DTI at or below 43% (with some exceptions).'},
{topic:0,type:'mc',text:'What is the primary purpose of the "ability-to-repay" (ATR) rule under Dodd-Frank?',options:['To ensure lenders maximize loan volume','To require lenders to make a reasonable, good-faith determination that a borrower can repay the loan before it is made','To eliminate the need for income documentation on all loan types','To restrict mortgage lending to borrowers with perfect credit'],answer:1,explanation:'The ATR rule requires lenders to verify and document the borrower\'s income, assets, employment, credit history, monthly payment obligations, and other factors before approving a mortgage. It was designed to prevent the reckless lending that contributed to the 2008 crisis.'},

// ═══════════════════════════════════════════
// TOPIC 1 — Federal Mortgage Laws
// ═══════════════════════════════════════════
{topic:1,type:'mc',text:'Under RESPA, which document must be provided to the borrower no later than 3 business days after receiving a loan application?',options:['Closing Disclosure','Loan Estimate','HUD-1 Settlement Statement','Good Faith Estimate'],answer:1,explanation:'Under TRID, the Loan Estimate must be delivered within 3 business days of receiving the application. It replaced the old Good Faith Estimate and early Truth-in-Lending disclosure.'},
{topic:1,type:'tf',text:'True or False: ECOA prohibits lenders from discriminating based on race, color, religion, national origin, sex, familial status, and disability.',options:['True','False'],answer:1,explanation:'ECOA prohibits discrimination based on race, color, religion, national origin, sex, MARITAL STATUS, and AGE. Familial status and disability are covered under the Fair Housing Act, not ECOA.'},
{topic:1,type:'mc',text:'Under TILA, the Annual Percentage Rate (APR) is designed to:',options:['Reflect only the note interest rate','Include the note rate plus certain fees to show the true cost of credit','Be identical to the interest rate on all loan products','Only apply to adjustable-rate mortgages'],answer:1,explanation:'APR is a broader measure of credit cost that includes the interest rate plus certain fees (origination fees, discount points), expressed as a yearly rate, allowing consumers to compare loan costs across lenders.'},
{topic:1,type:'mc',text:'HMDA data collection is primarily used for which purpose?',options:['Setting interest rate limits','Identifying potential discriminatory lending patterns','Tracking MLO production volumes','Establishing property tax assessments'],answer:1,explanation:'HMDA requires lenders to collect and report data on mortgage applications. Regulators use this data to analyze lending patterns and identify potential discrimination or redlining.'},
{topic:1,type:'tf',text:'True or False: Under RESPA, a lender is permitted to pay a referral fee to a real estate agent for steering borrowers to their company, as long as services are actually performed.',options:['True','False'],answer:1,explanation:'RESPA Section 8 strictly prohibits kickbacks and unearned fees. Paying a fee solely for referrals is illegal even if some service is performed. Only fees for actual, reasonably priced services are permitted.'},
{topic:1,type:'mc',text:'Under ECOA, a lender must notify a loan applicant of adverse action within how many days of receiving a completed application?',options:['15 days','30 days','45 days','60 days'],answer:1,explanation:'ECOA requires adverse action notices within 30 days of receiving a completed application. The notice must state specific reasons for denial or inform the applicant of the right to request those reasons.'},
{topic:1,type:'mc',text:'Which law requires lenders to provide borrowers with a Closing Disclosure at least 3 business days before loan consummation?',options:['RESPA only','TILA only','TRID (TILA-RESPA Integrated Disclosure rule)','HMDA'],answer:2,explanation:'TRID, implemented by the CFPB in 2015, combined RESPA and TILA disclosures. The Closing Disclosure must be received at least 3 business days before closing.'},
{topic:1,type:'tf',text:'True or False: The Right of Rescission under TILA allows a borrower to cancel a primary purchase mortgage within 3 business days of closing.',options:['True','False'],answer:1,explanation:'The Right of Rescission applies to refinances and home equity loans on a primary residence — NOT to purchase money mortgages. A borrower buying a home cannot rescind the purchase mortgage under TILA.'},
{topic:1,type:'mc',text:'Under HMDA, what is the purpose of collecting data on the race and ethnicity of mortgage applicants?',options:['To allow lenders to offer race-based rates','To help government agencies identify fair lending compliance','To market to specific demographic groups','To determine credit scoring adjustments'],answer:1,explanation:'HMDA data helps regulators monitor and enforce fair lending laws by analyzing whether lenders are serving all segments of their communities and identifying potential patterns of discrimination.'},
{topic:1,type:'tf',text:'True or False: RESPA applies to all real estate transactions including commercial and agricultural properties.',options:['True','False'],answer:1,explanation:'RESPA applies specifically to federally related mortgage loans on residential properties (1-4 family homes). Commercial, agricultural, and loans above 25 acres are generally exempt.'},
{topic:1,type:'mc',text:'What is "Regulation Z" as it relates to mortgage lending?',options:['The implementing regulation for RESPA','The implementing regulation for TILA (Truth in Lending Act)','The implementing regulation for ECOA','The implementing regulation for HMDA'],answer:1,explanation:'Regulation Z is the Federal Reserve\'s (now CFPB\'s) implementing regulation for TILA. It governs disclosure of credit terms, the right of rescission, advertising requirements, and the Loan Estimate and Closing Disclosure under TRID.'},
{topic:1,type:'tf',text:'True or False: Under the Fair Housing Act, a lender can refuse to make a mortgage loan to a family because they have young children.',options:['True','False'],answer:1,explanation:'Familial status (having children under 18) is a protected class under the Fair Housing Act. Denying a loan because of the presence of children is illegal discrimination. The FHA covers race, color, national origin, religion, sex, familial status, and disability.'},
{topic:1,type:'mc',text:'What does "Regulation X" govern in mortgage lending?',options:['Truth-in-Lending disclosures and APR calculations','The Real Estate Settlement Procedures Act (RESPA)','Fair lending and equal credit opportunity','Home Mortgage Disclosure Act reporting'],answer:1,explanation:'Regulation X is the CFPB\'s implementing regulation for RESPA. It governs settlement procedures, prohibits kickbacks and referral fees, regulates escrow accounts, and requires the Loan Estimate and Closing Disclosure under TRID.'},
{topic:1,type:'mc',text:'Under TRID, which of the following changes would trigger a new 3-business-day waiting period for a revised Closing Disclosure?',options:['A minor change in prepaid interest due to closing date change','The APR increases by more than 1/8 of 1% (0.125%) above the amount disclosed','A change in the settlement agent\'s name','An increase in homeowner\'s insurance premium of $20'],answer:1,explanation:'Three events trigger a new 3-day waiting period: (1) APR increases more than 1/8% (0.125%) for fixed-rate or 1/4% for variable; (2) loan product changes (e.g., fixed to ARM); (3) a prepayment penalty is added.'},
{topic:1,type:'tf',text:'True or False: Under RESPA, sellers are prohibited from requiring buyers to purchase title insurance from a specific company as a condition of the sale.',options:['True','False'],answer:0,explanation:'RESPA Section 9 prohibits sellers from requiring buyers to purchase title insurance from a particular company as a condition of the sale. Violating this provision can result in penalties equal to three times the title insurance charge.'},
{topic:1,type:'mc',text:'The Home Ownership and Equity Protection Act (HOEPA) provides enhanced protections for which type of loan?',options:['All conventional conforming mortgages','High-cost mortgages that exceed certain APR and fee thresholds','FHA-insured purchase loans','Loans to first-time homebuyers with low credit scores'],answer:1,explanation:'HOEPA (an amendment to TILA) provides extra protections for high-cost mortgages — loans where the APR exceeds benchmark rates or points and fees exceed certain thresholds. High-cost loans face additional restrictions on terms and balloon payments.'},
{topic:1,type:'mc',text:'Which federal law specifically requires mortgage servicers to respond to "qualified written requests" from borrowers within a set time period?',options:['ECOA','TILA','RESPA','HMDA'],answer:2,explanation:'RESPA requires mortgage servicers to acknowledge a Qualified Written Request (QWR) from a borrower within 5 business days and provide a substantive response within 30 business days (extendable to 45 days with notice).'},
{topic:1,type:'tf',text:'True or False: ECOA requires lenders to retain loan application records for at least 25 months after the application.',options:['True','False'],answer:0,explanation:'ECOA (Regulation B) requires lenders to preserve records of credit applications and actions for at least 25 months for consumer credit (12 months for business credit). This is the correct minimum retention period under Regulation B.'},
{topic:1,type:'mc',text:'What is the "CFPB" and when was it established?',options:['Community Finance and Banking Panel; established 1999','Consumer Financial Protection Bureau; established 2010 by Dodd-Frank','Consumer Fraud Prevention Bureau; established 2002','Credit and Financial Products Bureau; established 2008'],answer:1,explanation:'The CFPB (Consumer Financial Protection Bureau) was created by the Dodd-Frank Wall Street Reform and Consumer Protection Act of 2010 to supervise and regulate consumer financial products and services, including mortgages.'},
{topic:1,type:'tf',text:'True or False: Under TILA, an advertisement for a mortgage product that mentions a monthly payment amount must also disclose the annual percentage rate (APR).',options:['True','False'],answer:0,explanation:'TILA\'s advertising rules (Reg Z) require that if any "trigger term" (like a payment amount, down payment, or loan term) is used in an ad, certain additional disclosures — including the APR — must also appear. One trigger pulls in all required disclosures.'},
{topic:1,type:'mc',text:'Under RESPA, what is the maximum amount a lender can require in an escrow account cushion?',options:['1 month of projected payments','2 months of projected payments','3 months of projected payments','There is no limit on escrow cushion amounts'],answer:1,explanation:'RESPA limits the escrow cushion (the reserve a lender can maintain above expected disbursements) to a maximum of 2 months of projected escrow payments. Lenders must perform an annual escrow analysis and refund any excess over this amount.'},
{topic:1,type:'mc',text:'Which of the following loans is EXEMPT from TRID (Loan Estimate and Closing Disclosure) requirements?',options:['FHA purchase loan','VA refinance loan','Reverse mortgage (HECM)','Conventional conforming purchase loan'],answer:2,explanation:'Reverse mortgages are exempt from TRID. They use separate disclosures required by HUD. Other TRID exemptions include home equity lines of credit (HELOCs), mobile home loans not secured by real estate, and chattel loans.'},
{topic:1,type:'tf',text:'True or False: The Fair Housing Act and ECOA cover all the same protected classes.',options:['True','False'],answer:1,explanation:'The Fair Housing Act covers race, color, national origin, religion, sex, familial status, and disability. ECOA covers race, color, national origin, religion, sex, marital status, and age. The key differences: FHA includes familial status and disability; ECOA includes marital status and age.'},
{topic:1,type:'mc',text:'Under HMDA, which institutions are required to report mortgage loan data?',options:['Only banks with assets over $10 billion','All mortgage lenders regardless of size or charter','Depository institutions and non-depository institutions meeting asset and activity thresholds','Only federal savings associations and credit unions'],answer:2,explanation:'HMDA applies to both depository (banks, credit unions, savings associations) and non-depository (mortgage companies) institutions that meet certain asset size, loan volume, and geographic thresholds set by the CFPB.'},
{topic:1,type:'tf',text:'True or False: Under ECOA, a lender may ask about an applicant\'s immigration status when evaluating a mortgage application.',options:['True','False'],answer:0,explanation:'Lenders may ask about immigration/residency status to determine if the borrower is legally able to enter into a contract and to verify identity. However, they CANNOT deny credit based solely on national origin or alien status if the borrower is otherwise creditworthy and legally present.'},
{topic:1,type:'mc',text:'A "tolerance" under TRID refers to:',options:['The borrower\'s permitted debt-to-income ratio variance','Limits on how much certain closing cost estimates on the Loan Estimate can increase by the time of closing','The allowable difference between appraised value and purchase price','Permitted variance in the interest rate between pre-approval and closing'],answer:1,explanation:'TRID tolerances define how much specific fees can increase from the Loan Estimate to the Closing Disclosure. Zero tolerance items cannot increase at all; 10% tolerance items can collectively increase up to 10%; unlimited tolerance items can change freely.'},
{topic:1,type:'mc',text:'Which of the following is a "zero tolerance" fee under TRID — meaning it cannot increase from the Loan Estimate to the Closing Disclosure?',options:['Homeowner\'s insurance premium','Transfer taxes','Lender origination charges (fees and points)','Pest inspection fee'],answer:2,explanation:'Lender origination charges (fees for the lender\'s services, including origination fees and discount points) are zero-tolerance items — they cannot increase at all from LE to CD. Other zero-tolerance items include transfer taxes and fees for required lender-selected services.'},
{topic:1,type:'tf',text:'True or False: The Military Lending Act (MLA) provides special mortgage protections for active-duty service members and their dependents.',options:['True','False'],answer:1,explanation:'The MLA caps the Military Annual Percentage Rate (MAPR) at 36% for certain consumer loans but generally EXCLUDES residential mortgages (purchase and refinance). The Servicemembers Civil Relief Act (SCRA) is the key law protecting military members in mortgage matters.'},
{topic:1,type:'mc',text:'Under the Servicemembers Civil Relief Act (SCRA), what protection is available regarding mortgage interest rates for active-duty service members?',options:['All mortgage debt is forgiven during deployment','The interest rate on pre-service mortgages is capped at 6% during active duty','Service members may defer all mortgage payments without penalty indefinitely','Lenders must refinance service member loans at current market rates for free'],answer:1,explanation:'SCRA caps mortgage interest rates at 6% per year for loans taken out before active military service. The service member must submit a written request and a copy of their orders. The reduction applies for the duration of active duty.'},
{topic:1,type:'mc',text:'Which agency enforces the Fair Housing Act in mortgage lending cases?',options:['CFPB only','HUD (Department of Housing and Urban Development) and DOJ (Department of Justice)','FDIC and OCC only','FTC (Federal Trade Commission)'],answer:1,explanation:'HUD and the Department of Justice are the primary enforcers of the Fair Housing Act. HUD investigates complaints and can refer cases to DOJ for civil action. The CFPB also has fair lending enforcement authority under ECOA and HMDA.'},
{topic:1,type:'tf',text:'True or False: A lender who violates TILA\'s right of rescission rules may be required to return all finance charges and fees paid by the borrower.',options:['True','False'],answer:0,explanation:'TILA provides that if a lender fails to properly disclose rescission rights or material terms, the borrower\'s right to rescind can be extended up to 3 years after consummation. Upon valid rescission, the lender must return all finance charges and fees.'},

// ═══════════════════════════════════════════
// TOPIC 2 — Loan Origination & Application
// ═══════════════════════════════════════════
{topic:2,type:'mc',text:'The Uniform Residential Loan Application (URLA) is also known as:',options:['Form 1003','Form HUD-1','Form 1099-MISC','Form W-9'],answer:0,explanation:'The Fannie Mae Form 1003 (also Freddie Mac Form 65) is the standard Uniform Residential Loan Application used industry-wide. MLOs must be proficient in completing and reviewing this form.'},
{topic:2,type:'tf',text:'True or False: An MLO is required to issue a Loan Estimate even if the borrower has not yet found a specific property.',options:['True','False'],answer:0,explanation:'A Loan Estimate can be issued before a property address is identified. Lenders must issue a LE within 3 business days of receiving the 6 key application pieces, even if a property address is estimated.'},
{topic:2,type:'mc',text:'The six pieces of information that trigger a loan application and require a Loan Estimate include all of the following EXCEPT:',options:['Borrower\'s name','Borrower\'s Social Security number','Property address','Borrower\'s employment history for the past 10 years'],answer:3,explanation:'The 6 triggering items are: name, SSN, income, property address, estimated property value, and desired loan amount. Employment history detail is collected during processing but is NOT one of the 6 application triggers.'},
{topic:2,type:'mc',text:'During the loan origination process, "loan processing" refers to:',options:['The final approval of a loan by an underwriter','Collecting and verifying documents to support the loan application','Distributing funds at the closing table','Marketing loan products to potential borrowers'],answer:1,explanation:'Loan processing involves gathering, organizing, and verifying all documents needed for underwriting — income verification, asset statements, credit reports, appraisals, title work, etc.'},
{topic:2,type:'tf',text:'True or False: A borrower\'s credit score is typically obtained during the loan origination phase, before the application is submitted to underwriting.',options:['True','False'],answer:0,explanation:'Credit reports and scores are pulled early in the origination process to assess borrower creditworthiness, discuss any issues, and determine appropriate loan products before the file is sent to underwriting.'},
{topic:2,type:'mc',text:'What does DTI (Debt-to-Income ratio) measure in a mortgage application?',options:['The ratio of the down payment to the purchase price','Monthly debt obligations compared to gross monthly income','The difference between appraised value and loan amount','The borrower\'s total assets versus total liabilities'],answer:1,explanation:'DTI compares a borrower\'s total monthly debt payments (including the proposed housing payment) to their gross monthly income. It is one of the most critical qualification metrics in underwriting.'},
{topic:2,type:'mc',text:'Which of the following is considered an acceptable source of down payment funds?',options:['An undisclosed personal loan from a friend','Proceeds from the sale of a current property','Cash found at home with no paper trail','A payday loan taken 30 days before closing'],answer:1,explanation:'Sale of a current property is a fully acceptable, documented source of funds. Unsourced cash, undisclosed loans, or short-term borrowed funds are not acceptable and may indicate financial instability.'},
{topic:2,type:'tf',text:'True or False: A mortgage loan officer is permitted to accept a fee from both the borrower and the lender on the same transaction.',options:['True','False'],answer:1,explanation:'Under RESPA and the LO Compensation Rule (Regulation Z), an MLO cannot be paid by both the borrower and the lender on the same transaction. This dual compensation is strictly prohibited.'},
{topic:2,type:'mc',text:'What is the purpose of the "intent to proceed" in the mortgage process?',options:['The borrower formally agrees to final loan terms at closing','The borrower signals they wish to move forward after receiving the Loan Estimate','The lender commits to a specific interest rate for 60 days','The underwriter gives preliminary approval of the file'],answer:1,explanation:'After receiving the Loan Estimate, the borrower must communicate their "intent to proceed" before the lender can collect any fees beyond the credit report fee. This protects consumers from paying non-refundable fees prematurely.'},
{topic:2,type:'tf',text:'True or False: An MLO may charge a fee for issuing a pre-qualification letter to a borrower.',options:['True','False'],answer:1,explanation:'A pre-qualification is an informal assessment and does not constitute a formal loan application. MLOs generally do not — and should not — charge fees for pre-qualifications.'},
{topic:2,type:'mc',text:'Which of the following documents would NOT typically be required to verify income for a salaried W-2 employee?',options:['Two years of W-2 forms','Most recent 30 days of pay stubs','Two years of business tax returns','Verification of employment (VOE) form'],answer:2,explanation:'Business tax returns are required for self-employed borrowers, not salaried W-2 employees. Salaried borrowers typically provide W-2s, pay stubs, and sometimes a VOE. Business returns are needed when the borrower owns 25% or more of a business.'},
{topic:2,type:'tf',text:'True or False: When a borrower\'s application is denied, the lender must provide the specific reasons for denial, even if not asked.',options:['True','False'],answer:0,explanation:'Under ECOA, lenders must provide an adverse action notice with specific reasons for denial — or notify the applicant of the right to request reasons — within 30 days of the credit decision. The CFPB requires specific reasons to be stated on the adverse action notice.'},
{topic:2,type:'mc',text:'What is a "rate lock"?',options:['A penalty for paying off a mortgage early','A lender\'s commitment to hold a specific interest rate for a defined period while the loan is processed','The process of comparing rates among multiple lenders','An adjustable-rate mortgage with a minimum fixed period'],answer:1,explanation:'A rate lock is a lender\'s guarantee to hold a specific interest rate (and sometimes points) for a set period — typically 30 to 60 days — while the loan is processed and underwritten. This protects the borrower from rate increases before closing.'},
{topic:2,type:'mc',text:'Which section of Form 1003 captures information about the borrower\'s assets and liabilities?',options:['Section 1 — Borrower Information','Section 2 — Financial Information — Assets and Liabilities','Section 4 — Loan and Property Information','Section 6 — Acknowledgments and Agreements'],answer:1,explanation:'The redesigned URLA (Form 1003) captures assets (checking, savings, retirement, real estate) and liabilities (monthly debts, other mortgages, installment loans) in Section 2 — Financial Information. This data is critical for DTI and asset qualification.'},
{topic:2,type:'tf',text:'True or False: Lenders are required to re-disclose a Loan Estimate if the APR changes by more than 1/8 of 1 percent on a fixed-rate loan.',options:['True','False'],answer:0,explanation:'Under TRID, if the APR increases beyond the tolerance threshold (more than 1/8% for fixed-rate loans), the lender must provide a revised Loan Estimate or an updated Closing Disclosure and restart the 3-business-day waiting period.'},
{topic:2,type:'mc',text:'What is "layering" of risk in mortgage underwriting?',options:['Combining multiple loan products to finance one property','The accumulation of multiple risk factors (high LTV + low credit score + high DTI) in a single loan file','Using multiple appraisal methods to determine value','Splitting a loan into first and second mortgages to avoid PMI'],answer:1,explanation:'Risk layering refers to combining multiple compensating weaknesses in one file — for example, a borrower with a low credit score, high DTI, AND a high LTV. Each factor alone may be acceptable, but combined they significantly increase default risk.'},
{topic:2,type:'mc',text:'What is the purpose of a "Verification of Deposit" (VOD) in the loan application process?',options:['To confirm the borrower\'s employment dates and salary','To verify bank account balances and history for down payment and reserves','To document the property\'s chain of title','To confirm the borrower has no outstanding judgments'],answer:1,explanation:'A VOD is a form sent directly to the borrower\'s financial institution to independently verify account balances, account history, and average balances. It supplements bank statements and is used to confirm down payment funds and reserves.'},
{topic:2,type:'tf',text:'True or False: A borrower who receives a gift for their down payment must always repay that gift according to an agreed schedule.',options:['True','False'],answer:1,explanation:'Gift funds for a down payment must be truly a gift — they CANNOT be a loan that must be repaid. The gift donor must sign a gift letter confirming no repayment is expected. Any requirement to repay would be considered an undisclosed liability.'},
{topic:2,type:'mc',text:'What does "back-end DTI" include that "front-end DTI" does not?',options:['Property taxes and homeowner\'s insurance','All recurring monthly debts including credit cards, car loans, student loans, plus the housing payment','Only the proposed principal and interest payment','Utility costs and food expenses'],answer:1,explanation:'Front-end (housing) DTI includes only housing costs (P&I, taxes, insurance, HOA). Back-end (total) DTI includes ALL monthly debts: housing payment plus credit cards, car loans, student loans, and other installment or revolving debt obligations.'},
{topic:2,type:'tf',text:'True or False: When a borrower pays "discount points," each point equals 1% of the loan amount and typically reduces the interest rate.',options:['True','False'],answer:0,explanation:'One discount point equals 1% of the loan amount. Borrowers pay points upfront to "buy down" (reduce) the interest rate. The rate reduction per point varies by lender and market conditions but is typically around 0.25% per point.'},
{topic:2,type:'mc',text:'What does "PITI" stand for in mortgage lending?',options:['Principal, Interest, Taxes, and Insurance','Property, Income, Title, and Investment','Prepayment, Interest rate, Term, and Index','Payment, Insurance, Tax, and Income'],answer:0,explanation:'PITI — Principal, Interest, Taxes, and Insurance — represents the total monthly housing payment used in qualifying borrowers. It includes the loan P&I, property taxes, homeowner\'s insurance, and mortgage insurance (if applicable), plus any HOA dues.'},
{topic:2,type:'mc',text:'Under the LO Compensation Rule, which statement is TRUE regarding MLO pay?',options:['MLOs may receive bonuses based on loan terms such as interest rate or fees charged','MLO compensation may be based on the overall volume of loans originated in a period','MLOs can charge extra fees if the borrower\'s file requires more work than anticipated','MLOs may be paid differently based on the property type (condo vs. single family)'],answer:1,explanation:'Under Regulation Z\'s LO Compensation Rule, MLOs may be compensated based on loan volume or fixed amounts, but NOT based on the terms of individual loans (rate, fees, LTV, etc.). This prevents steering borrowers into higher-cost products for higher MLO pay.'},
{topic:2,type:'tf',text:'True or False: An MLO must inform a borrower if their loan application will be reviewed using an automated underwriting system (AUS).',options:['True','False'],answer:1,explanation:'There is no specific regulatory requirement to disclose to borrowers that an AUS (like Fannie Mae\'s Desktop Underwriter or Freddie Mac\'s Loan Product Advisor) will be used. The use of AUS is standard industry practice and is not considered a material disclosure.'},
{topic:2,type:'mc',text:'What is a "tri-merge" credit report?',options:['A credit report that combines income, employment, and asset data','A credit report that merges data from all three major bureaus (Equifax, Experian, TransUnion) into one report','A report comparing three loan applications from the same borrower','A combined property inspection and appraisal report'],answer:1,explanation:'Mortgage lenders pull a tri-merge credit report that combines data from Equifax, Experian, and TransUnion into one report. The lender uses the middle of three scores (or lower of two if only two scores exist) for qualifying.'},
{topic:2,type:'mc',text:'What is the purpose of a "mortgage credit certificate" (MCC)?',options:['To document the terms of the mortgage loan','A tax credit for eligible first-time homebuyers equal to a percentage of annual mortgage interest paid','A certification that the borrower has completed homebuyer education','A document certifying the appraiser\'s credentials'],answer:1,explanation:'An MCC is a federal tax credit (not a deduction) issued by state and local housing finance agencies to eligible first-time homebuyers. It allows borrowers to claim a direct tax credit (typically 20-30% of mortgage interest) each year they occupy the home.'},
{topic:2,type:'tf',text:'True or False: A lender may charge a borrower for a credit report fee before the borrower has expressed an intent to proceed.',options:['True','False'],answer:0,explanation:'The credit report fee is the one exception to the rule that lenders cannot collect fees before the borrower\'s intent to proceed. Lenders may charge (but are not required to) for a credit report before the borrower decides to proceed.'},
{topic:2,type:'mc',text:'What is a "Notice of Incomplete Application" (NOI) under ECOA?',options:['A notice telling the borrower their DTI is too high to proceed','A notice sent to a borrower when more information or documentation is needed to complete the application','A denial letter based on the borrower\'s credit score','A notice that the property failed the appraisal inspection'],answer:1,explanation:'Under ECOA (Regulation B), if an application is incomplete, the lender must either request the specific information within 30 days or treat it as a denial. An NOI formally requests the missing information needed to complete and process the application.'},
{topic:2,type:'tf',text:'True or False: On Form 1003, borrowers are required to disclose child support obligations as a monthly liability.',options:['True','False'],answer:0,explanation:'Child support and alimony payments must be disclosed as monthly liabilities on Form 1003. These are included in the back-end DTI calculation. Failure to disclose known obligations is considered material misrepresentation and potential mortgage fraud.'},
{topic:2,type:'mc',text:'What does "occupancy type" refer to on a mortgage application, and why does it matter?',options:['Whether the property is urban, suburban, or rural','Whether the borrower intends to occupy the property as a primary residence, second home, or investment property — affecting rates and guidelines','Whether the building is owner-occupied or tenant-occupied at time of application','The number of units in the building'],answer:1,explanation:'Occupancy type (primary residence, second home, or investment property) significantly affects loan pricing, down payment requirements, and underwriting guidelines. Primary residences receive the best rates and terms. Misrepresenting occupancy (e.g., calling an investment property a primary) is occupancy fraud.'},

// ═══════════════════════════════════════════
// TOPIC 3 — Mortgage Products & Loan Types
// ═══════════════════════════════════════════
{topic:3,type:'mc',text:'Which loan type is specifically designed for veterans, active-duty military, and eligible surviving spouses, offering 100% financing with no PMI?',options:['FHA loan','USDA loan','VA loan','Conventional conforming loan'],answer:2,explanation:'VA loans are backed by the Department of Veterans Affairs and allow eligible borrowers to purchase with no down payment and no PMI. A VA funding fee is charged instead in most cases.'},
{topic:3,type:'tf',text:'True or False: FHA loans require a minimum down payment of 10% for all borrowers regardless of credit score.',options:['True','False'],answer:1,explanation:'FHA loans require only 3.5% down for borrowers with a credit score of 580+. Borrowers with scores 500-579 must put down 10%. FHA is known for its low down payment requirements.'},
{topic:3,type:'mc',text:'What is the key characteristic of a "conforming loan"?',options:['It must be insured by the FHA','Its loan amount falls at or below the FHFA\'s conforming loan limit','It requires a minimum 20% down payment','It is only available to first-time homebuyers'],answer:1,explanation:'A conforming loan meets the loan limit and guideline requirements set by Fannie Mae and Freddie Mac. Loans exceeding these limits are called "jumbo" or non-conforming loans.'},
{topic:3,type:'mc',text:'In an Adjustable-Rate Mortgage (ARM), what does the "5/1" in a 5/1 ARM mean?',options:['5% interest rate fixed for 1 year, then adjustable','Fixed for 5 years, then adjusts annually','5 adjustment caps with 1% maximum per adjustment','Fixed for 1 year, then adjusts every 5 years'],answer:1,explanation:'In a 5/1 ARM, the "5" means the rate is fixed for the first 5 years, and "1" means the rate adjusts every 1 year thereafter. ARM caps limit how much the rate can change per adjustment and over the life of the loan.'},
{topic:3,type:'tf',text:'True or False: A USDA Rural Development loan requires a minimum 5% down payment from the borrower.',options:['True','False'],answer:1,explanation:'USDA Rural Development loans offer 100% financing — no down payment required — for eligible rural and suburban properties. The property must be in a USDA-eligible area and borrowers must meet income limits.'},
{topic:3,type:'mc',text:'Private Mortgage Insurance (PMI) is typically required on conventional loans when the borrower\'s LTV ratio exceeds:',options:['70%','80%','90%','95%'],answer:1,explanation:'Conventional lenders require PMI when the LTV exceeds 80% (down payment less than 20%). Under the Homeowners Protection Act, PMI must be automatically cancelled when LTV reaches 78%.'},
{topic:3,type:'mc',text:'Which type of mortgage involves interest-only payments for a set period, followed by fully amortizing payments?',options:['Balloon mortgage','Interest-only mortgage','Reverse mortgage','Graduated payment mortgage'],answer:1,explanation:'An interest-only mortgage allows the borrower to pay only interest for an initial period, after which payments adjust to include both principal and interest, often resulting in significantly higher monthly payments.'},
{topic:3,type:'tf',text:'True or False: A reverse mortgage requires the borrower to make monthly principal and interest payments to the lender.',options:['True','False'],answer:1,explanation:'In a reverse mortgage (HECM), the lender pays the borrower. No monthly P&I payments are required. The loan becomes due when the borrower sells, moves out, or passes away. Taxes, insurance, and maintenance must still be paid.'},
{topic:3,type:'mc',text:'What distinguishes a "portfolio loan" from a conventional conforming loan?',options:['It has no interest rate','The lender keeps the loan on its own books rather than selling it to the secondary market','It must meet Fannie Mae or Freddie Mac guidelines','It is only available to investors with 10+ properties'],answer:1,explanation:'Portfolio loans are held by the originating lender in their own portfolio rather than being sold to Fannie/Freddie. Lenders have more flexibility in terms and qualification criteria for these loans.'},
{topic:3,type:'tf',text:'True or False: Jumbo loans typically carry higher interest rates than conforming loans due to increased lender risk.',options:['True','False'],answer:0,explanation:'Jumbo loans exceed conforming loan limits and cannot be sold to Fannie Mae or Freddie Mac. Because lenders retain more risk, jumbo loans typically require stricter qualification and historically carry slightly higher rates.'},
{topic:3,type:'mc',text:'What is FHA\'s Mortgage Insurance Premium (MIP)?',options:['A fee only charged at closing for loans with less than 5% down','A monthly premium that replaces PMI on FHA loans, plus an upfront premium of 1.75% of the loan amount','An optional insurance product for FHA borrowers with good credit','A fee charged to the lender for FHA loan approval'],answer:1,explanation:'FHA charges two types of MIP: an Upfront MIP (UFMIP) of 1.75% of the loan amount (usually financed into the loan) AND an Annual MIP paid monthly. Unlike conventional PMI, FHA MIP often remains for the life of the loan if the down payment is less than 10%.'},
{topic:3,type:'tf',text:'True or False: VA loans are available to all U.S. military veterans regardless of when or how long they served.',options:['True','False'],answer:1,explanation:'VA loan eligibility requires specific service requirements. Generally, veterans need 90 consecutive days of active duty during wartime, 181 days during peacetime, or 6 years in National Guard/Reserves. Dishonorable discharge disqualifies eligibility.'},
{topic:3,type:'mc',text:'What is a "balloon mortgage"?',options:['A loan with payments that gradually increase each year','A loan that requires full payment of the remaining balance at the end of a set term (e.g., 7 years)','A loan with no fixed payment amount','A loan where the borrower can skip payments without penalty'],answer:1,explanation:'A balloon mortgage has regular monthly payments (often amortized over 30 years) but requires a lump-sum "balloon" payment of the remaining balance at the end of a shorter term (typically 5, 7, or 10 years). The borrower must pay off, refinance, or sell by that date.'},
{topic:3,type:'mc',text:'What is the primary purpose of the VA funding fee on a VA loan?',options:['To replace homeowner\'s insurance for veteran borrowers','To fund the VA loan guarantee program and reduce the cost for taxpayers','To compensate the MLO for processing the VA loan','To cover the cost of the VA appraisal (Certificate of Reasonable Value)'],answer:1,explanation:'The VA funding fee is charged to help sustain the VA home loan program and reduce the burden on taxpayers. It varies based on down payment amount, loan type, and whether it\'s a first or subsequent VA loan use. Some veterans are exempt due to service-connected disability.'},
{topic:3,type:'tf',text:'True or False: Conventional loans backed by Fannie Mae or Freddie Mac can be used to purchase investment properties with just 3% down.',options:['True','False'],answer:1,explanation:'Fannie Mae\'s HomeReady and Freddie Mac\'s Home Possible programs offer 3% down only for owner-occupied PRIMARY residences. Investment properties require a minimum of 15-25% down on conventional loans depending on number of units and lender overlays.'},
{topic:3,type:'mc',text:'What does "negative amortization" mean in mortgage lending?',options:['The loan balance decreasing faster than the scheduled amortization','The monthly payment being less than the accrued interest, causing the loan balance to increase','The interest rate decreasing over the life of the loan','A loan that charges a penalty for early payoff'],answer:1,explanation:'Negative amortization occurs when the monthly payment doesn\'t cover all the interest due, so unpaid interest is added to the principal balance. The loan balance grows over time instead of decreasing. Negative amortization is prohibited on Qualified Mortgages.'},
{topic:3,type:'mc',text:'A "Home Equity Line of Credit" (HELOC) differs from a traditional second mortgage in that a HELOC:',options:['Must be repaid in full within 5 years','Provides a revolving credit line that can be drawn and repaid multiple times, like a credit card secured by home equity','Has a fixed interest rate and fixed monthly payment for its entire term','Cannot be used for home improvement purposes'],answer:1,explanation:'A HELOC is a revolving credit line secured by home equity. Borrowers can draw funds up to the approved limit, repay, and draw again during the draw period (typically 10 years). It usually has a variable rate, unlike a fixed second mortgage.'},
{topic:3,type:'tf',text:'True or False: A "no-cost" mortgage means the borrower pays absolutely no fees or costs associated with the loan.',options:['True','False'],answer:1,explanation:'A "no-cost" mortgage means closing costs are paid by the lender in exchange for a higher interest rate (lender credits), or rolled into the loan balance. The borrower still pays costs — they\'re just financed differently. There is no truly "free" mortgage.'},
{topic:3,type:'mc',text:'What is a "piggyback loan" (80-10-10)?',options:['A construction loan followed by a permanent mortgage','A first mortgage for 80%, a second mortgage for 10%, and 10% down payment to avoid PMI','An FHA loan combined with a VA loan on the same property','A loan that combines the purchase price and renovation costs'],answer:1,explanation:'A piggyback or 80-10-10 loan uses a first mortgage (80% LTV), a simultaneous second mortgage (10%), and a 10% down payment. This avoids PMI (since the first mortgage LTV is 80%) and avoids jumbo loan requirements.'},
{topic:3,type:'tf',text:'True or False: The Home Equity Conversion Mortgage (HECM) is the only reverse mortgage product insured by the federal government.',options:['True','False'],answer:0,explanation:'The HECM (Home Equity Conversion Mortgage) is the only reverse mortgage product insured by FHA/HUD. Private "proprietary" reverse mortgages also exist for higher-value homes but are not government-insured. HECMs have counseling requirements.'},
{topic:3,type:'mc',text:'Which loan program is specifically designed for borrowers who wish to purchase or refinance a rural property and meet income eligibility requirements?',options:['FHA 203(k)','Fannie Mae HomeReady','USDA Section 502 Guaranteed Loan','VA Interest Rate Reduction Refinance Loan (IRRRL)'],answer:2,explanation:'The USDA Section 502 Guaranteed Loan Program (Rural Development) provides 100% financing for eligible rural and suburban homebuyers who meet income limits (typically 115% of area median income) in USDA-designated eligible areas.'},
{topic:3,type:'mc',text:'What is the key feature of a "streamline refinance" on an FHA loan?',options:['It allows borrowers to cash out unlimited equity','It requires a full new appraisal and income verification','It allows existing FHA borrowers to refinance with reduced documentation and no appraisal if the loan is current','It is available to conventional borrowers with less than 20% equity'],answer:2,explanation:'FHA streamline refinances are available to existing FHA borrowers to lower their rate or payment with minimal documentation. No appraisal or income verification is required (in most cases), as long as the loan is current and the refinance passes a net tangible benefit test.'},
{topic:3,type:'tf',text:'True or False: An ARM\'s periodic adjustment cap limits how much the interest rate can change at each adjustment period.',options:['True','False'],answer:0,explanation:'ARM caps protect borrowers from extreme rate swings. A typical cap structure is expressed as 2/2/5: 2% maximum first adjustment, 2% maximum per subsequent adjustment, and 5% maximum change over the life of the loan (lifetime cap).'},
{topic:3,type:'mc',text:'What does "LTV" stand for and how is it calculated?',options:['Loan Total Value: loan amount plus all fees divided by income','Loan-to-Value: loan amount divided by the appraised value or purchase price (lower of the two)','Loan Transfer Value: the amount a loan can be sold for on the secondary market','Lender Transfer Verification: an automated check of loan file completeness'],answer:1,explanation:'LTV (Loan-to-Value) = Loan Amount ÷ Appraised Value (or purchase price, using the lower of the two). An 80% LTV means the borrower finances 80% of the property\'s value. Higher LTV = more risk and often triggers PMI.'},
{topic:3,type:'mc',text:'Which of the following best describes a "fixed-rate mortgage"?',options:['The interest rate changes with the market index but is capped at a maximum amount','The interest rate and monthly P&I payment remain constant for the entire loan term','The loan balance is fixed but the interest rate fluctuates','The lender fixes the rate for 3 years, after which the borrower must refinance'],answer:1,explanation:'A fixed-rate mortgage has an interest rate that never changes over the life of the loan, providing predictable monthly P&I payments. This stability makes fixed-rate mortgages the most popular product for long-term homeowners.'},
{topic:3,type:'tf',text:'True or False: A "construction-to-permanent" loan converts automatically to a permanent mortgage upon completion of construction without requiring a new loan application.',options:['True','False'],answer:0,explanation:'A construction-to-permanent (one-time-close) loan starts as a construction loan and automatically converts to a permanent mortgage when construction is complete. This eliminates the need for a second closing, saving time and closing costs.'},
{topic:3,type:'mc',text:'What is the FHA 203(k) loan program designed for?',options:['Low-income borrowers purchasing their first home','Purchasing or refinancing a home that also finances the cost of rehabilitation or renovation into a single loan','Financing the purchase of mobile or manufactured homes','Veteran borrowers purchasing in rural areas'],answer:1,explanation:'The FHA 203(k) program allows borrowers to finance both the purchase (or refinance) of a home AND the cost of its rehabilitation/renovation into a single FHA-insured mortgage. This is ideal for fixer-upper properties that need work to meet FHA minimum property standards.'},
{topic:3,type:'tf',text:'True or False: On a VA loan, a veteran can use their entitlement multiple times as long as prior VA loans are paid off.',options:['True','False'],answer:0,explanation:'VA loan entitlement can be restored and reused. Once a prior VA loan is paid off and the property is sold (or in some cases without selling), the veteran\'s entitlement is restored and they can use the VA benefit again — including for another zero-down purchase.'},

// ═══════════════════════════════════════════
// TOPIC 4 — Underwriting & Qualifying Borrowers
// ═══════════════════════════════════════════
{topic:4,type:'mc',text:'What are the traditional "Three C\'s" of credit analysis in mortgage underwriting?',options:['Collateral, Compliance, and Credit','Credit, Capacity, and Capital (plus Collateral)','Character, Conformity, and Cash Flow','Creditworthiness, Commitment, and Conditions'],answer:1,explanation:'Underwriters analyze Credit (history/score), Capacity (income/DTI), Capital (assets/reserves), and Collateral (property value). These form the backbone of mortgage underwriting analysis.'},
{topic:4,type:'tf',text:'True or False: Self-employed borrowers must typically provide 2 years of personal and business tax returns to verify income for a conventional mortgage.',options:['True','False'],answer:0,explanation:'Self-employed borrowers generally must provide 2 years of personal (1040s) and business tax returns, plus a year-to-date P&L. Lenders use the 2-year average of net income with depreciation added back.'},
{topic:4,type:'mc',text:'The maximum conventional conforming back-end DTI ratio typically allowed by Fannie Mae\'s DU system is approximately:',options:['28%','36%','45%','50%'],answer:2,explanation:'Fannie Mae\'s DU generally allows total back-end DTI up to 45%, and up to 50% with strong compensating factors (e.g., excellent credit, significant reserves). The 43% threshold applies to manually underwritten QM loans.'},
{topic:4,type:'mc',text:'What is "asset depletion" as an income qualification method?',options:['Using a borrower\'s declining credit score as a risk factor','Converting a borrower\'s liquid assets into a monthly income stream for qualification','Documenting that retirement assets are in taxable accounts','Verifying a borrower depleted savings for the down payment'],answer:1,explanation:'Asset depletion divides a borrower\'s verified liquid assets by a set number of months (e.g., 360) to create a qualifying "income." This helps asset-rich but income-limited borrowers (like retirees) qualify for a mortgage.'},
{topic:4,type:'tf',text:'True or False: A borrower with a bankruptcy discharged 2 years ago is automatically disqualified from obtaining an FHA loan.',options:['True','False'],answer:1,explanation:'FHA allows borrowers after a Chapter 7 bankruptcy with only a 2-year waiting period from the discharge date. With extenuating circumstances, this may be reduced to 1 year. The borrower must have re-established good credit.'},
{topic:4,type:'mc',text:'Which credit scoring model is most commonly used by mortgage lenders for underwriting decisions?',options:['VantageScore 3.0','FICO Score 9','Classic FICO (versions 2, 4, and 5)','TransUnion CreditVision'],answer:2,explanation:'Mortgage lenders use classic FICO models: Equifax Beacon 5.0, Experian/Fair Isaac Risk Model v2, and TransUnion FICO Risk Score 04. Fannie Mae and Freddie Mac have been gradually updating requirements but classic FICO remains the standard.'},
{topic:4,type:'mc',text:'In mortgage underwriting, "seasoned funds" refers to:',options:['Funds that have earned substantial interest over time','Funds that have been in the borrower\'s account for at least 60 days','Retirement account funds that have matured','Any funds sourced from a relative'],answer:1,explanation:'Seasoned funds have been in the borrower\'s account for at least 60 days (the period covered by bank statements). Seasoned funds don\'t require a gift letter or source documentation since they\'re established in the account.'},
{topic:4,type:'tf',text:'True or False: A loan officer determines the final loan approval or denial decision for a mortgage application.',options:['True','False'],answer:1,explanation:'The underwriter — not the loan officer — makes the final credit decision (approve, suspend, or deny). The MLO originates and packages the loan, but credit authority rests with the underwriter.'},
{topic:4,type:'mc',text:'What does LTV (Loan-to-Value) ratio represent in mortgage underwriting?',options:['The borrower\'s monthly income compared to the loan amount','The loan amount divided by the appraised value or purchase price (whichever is lower)','The ratio of total debt to property value','The lender\'s required return on investment'],answer:1,explanation:'LTV = Loan Amount ÷ Appraised Value (or purchase price, using the lower of the two). An 80% LTV means the borrower is financing 80% of the property value. Higher LTV = more risk for the lender.'},
{topic:4,type:'tf',text:'True or False: Rental income from an investment property can always be counted as qualifying income at 100% of the market rent.',options:['True','False'],answer:1,explanation:'Rental income is typically counted at 75% of gross rents (25% vacancy/expense factor) per Fannie/Freddie guidelines. Full 100% counting generally requires 2 years of documented rental history on tax returns.'},
{topic:4,type:'mc',text:'What is a "conditioned approval" (also called "conditional approval") in mortgage underwriting?',options:['A loan approval that is valid only in one state','An approval granted with specific outstanding items (conditions) that must be satisfied before final loan approval','A pre-qualification letter with no binding commitment from the lender','A denial that can be overturned if the borrower improves their credit score'],answer:1,explanation:'A conditional approval (also called "approved with conditions" or "suspend") means the underwriter is willing to approve the loan but needs additional documentation or clarification before issuing a final "clear to close."'},
{topic:4,type:'tf',text:'True or False: For conventional loans, a Chapter 13 bankruptcy requires a 4-year waiting period from the discharge date before the borrower can qualify.',options:['True','False'],answer:1,explanation:'Fannie Mae requires only a 2-year waiting period from the Chapter 13 discharge date (or 4 years from the dismissal date). Chapter 7 has a 4-year waiting period from discharge. FHA requirements are shorter (1-2 years for both Chapter 7 and 13).'},
{topic:4,type:'mc',text:'What is the purpose of "compensating factors" in mortgage underwriting?',options:['To penalize borrowers for exceeding maximum DTI limits','To allow underwriters to approve loans that exceed standard guidelines when mitigating strengths are present','To calculate the borrower\'s net worth for estate planning purposes','To determine which loan product a borrower should receive'],answer:1,explanation:'Compensating factors are positive borrower attributes — such as large reserves, low LTV, strong credit score, or significant income history — that offset risk factors like high DTI. They allow borderline files to receive approval.'},
{topic:4,type:'mc',text:'Which document is used by Fannie Mae\'s automated underwriting system?',options:['Freddie Mac\'s Loan Product Advisor (LPA)','Desktop Underwriter (DU)','FHA\'s TOTAL Mortgage Scorecard','VA\'s Lender Appraisal Processing Program'],answer:1,explanation:'Fannie Mae\'s automated underwriting system is called Desktop Underwriter (DU). Freddie Mac uses Loan Product Advisor (LPA). FHA uses TOTAL Mortgage Scorecard. DU analyzes the loan application and provides a risk assessment and eligibility recommendation.'},
{topic:4,type:'tf',text:'True or False: A "no-ratio" loan allows a borrower to qualify without providing any income documentation.',options:['True','False'],answer:0,explanation:'A no-ratio loan does not require the borrower to state income, and therefore no DTI ratio is calculated. These were common "stated income" products before the financial crisis and are now very limited due to ATR requirements. Some non-QM lenders still offer them for specific borrowers.'},
{topic:4,type:'mc',text:'When underwriting a self-employed borrower\'s income, which form is used to calculate depreciation and mileage deductions that can be added back to qualifying income?',options:['Form W-2','Schedule C (Profit and Loss from Business)','Form 1099-INT','Form 4506-C'],answer:1,explanation:'Schedule C (and Schedule E for rental/partnership income) is where self-employed income and business deductions are reported. Non-cash deductions like depreciation, depletion, and mileage can be added back to the net income figure for qualifying purposes.'},
